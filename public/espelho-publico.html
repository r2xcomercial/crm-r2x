// ── Carregamento principal ───────────────────────────────────────────────────
async function carregar() {
  try {
    const r    = await fetch(`/api/espelho-publico/${slug}`);
    const resp = await r.json();
    if (!resp.ok) {
      document.getElementById('conteudo').innerHTML = `<div class="erro">⚠️ ${resp.error}</div>`;
      return;
    }

    const { empreendimento: emp, imagem, units, resumo, espelhoParams, markerSize, mapsUrl, driveUrl, socialUrl, atualizado_em } = resp.data;
    _empNome    = emp.nome + (emp.cidade ? ` — ${emp.cidade}/${emp.estado}` : '');
    _empTipo    = emp.tipo || 'loteamento';
    _simParams  = espelhoParams || null;
    _markerSize = markerSize || 20;
    _mapsUrl    = mapsUrl || null;
    _driveUrl   = driveUrl || null;
    _socialUrl  = socialUrl || null;
    const mapsBtn = document.getElementById('maps-btn');
    if (mapsBtn) { mapsBtn.href = _mapsUrl || '#'; mapsBtn.style.display = _mapsUrl ? '' : 'none'; }
    const driveBtn = document.getElementById('drive-btn');
    if (driveBtn) { driveBtn.href = _driveUrl || '#'; driveBtn.style.display = _driveUrl ? '' : 'none'; }
    const socialBtn = document.getElementById('social-btn');
    if (socialBtn) { socialBtn.href = _socialUrl || '#'; socialBtn.style.display = _socialUrl ? '' : 'none'; }
    const exportBtn = document.getElementById('export-btn');
    if (exportBtn) exportBtn.style.display = 'flex';
    const pdfBtn = document.getElementById('pdf-btn');
    if (pdfBtn) pdfBtn.style.display = 'flex';

    document.title = `Espelho — ${emp.nome}`;
    document.getElementById('emp-nome').textContent  = _empNome;
    document.getElementById('hora-atual').textContent = new Date(atualizado_em).toLocaleTimeString('pt-BR');

    document.getElementById('r-total').textContent = units.length;
    document.getElementById('r-disp').textContent  = resumo.disponivel || 0;
    document.getElementById('r-res').textContent   = resumo.reservado  || 0;
    document.getElementById('r-vend').textContent  = resumo.vendido    || 0;
    const indispCard = document.getElementById('r-indisp-card');
    if (resumo.indisponivel) {
      document.getElementById('r-indisp').textContent = resumo.indisponivel;
      if (indispCard) indispCard.style.display = '';
    } else {
      if (indispCard) indispCard.style.display = 'none';
    }

    const sortNum = (a, b) => {
      const qa = String(a.quadra||''), qb = String(b.quadra||'');
      const qna = parseFloat(qa), qnb = parseFloat(qb);
      const qcmp = (!isNaN(qna) && !isNaN(qnb)) ? qna - qnb : qa.localeCompare(qb, 'pt-BR', {numeric:true});
      if (qcmp !== 0) return qcmp;
      const la = parseFloat(String(a.lote||'').replace(/\D.*$/,'')) || 0;
      const lb = parseFloat(String(b.lote||'').replace(/\D.*$/,'')) || 0;
      return la !== lb ? la - lb : String(a.lote||'').localeCompare(String(b.lote||''), 'pt-BR', {numeric:true});
    };
    units.sort(sortNum);
    window._units = units;
    const comPosicao = units.filter(u => u.mapa_x != null && u.mapa_y != null);
    const html = [];

    const simHint = _simParams
      ? `<span class="leg-sim-hint">💡 Clique em um lote para simular</span>`
      : '';

    html.push(`<div class="legenda">
      <div class="leg-item"><div class="leg-dot disponivel"></div>Disponível</div>
      <div class="leg-item"><div class="leg-dot reservado"></div>Reservado</div>
      <div class="leg-item"><div class="leg-dot vendido"></div>Vendido</div>
      ${resumo.indisponivel ? `<div class="leg-item"><div class="leg-dot indisponivel"></div>Indisponível</div>` : ''}
      ${simHint}
    </div>`);

    if (imagem && comPosicao.length > 0) {
      html.push(`<div class="mapa-outer" id="mapa-outer">
        <div class="mapa-wrap" id="mapa-wrap">
          <img src="${imagem}" id="mapa-img" alt="Mapa" onload="ajustarMarcadores()">
          <div id="marcadores"></div>
        </div>
      </div>`);
      document.getElementById('conteudo').innerHTML = html.join('');
      window._comPosicao = comPosicao;
      ajustarMarcadores();
      initMapaPinchZoom();
    } else {
      if (imagem) {
        html.push(`<div style="margin-bottom:20px"><img src="${imagem}" style="width:100%;max-width:1100px;border-radius:12px;display:block" alt="Mapa"></div>`);
      }
      if (_empTipo === 'predio') {
        const gps = {};
        for (const u of units) {
          const g = (u.quadra != null && u.quadra !== '') ? String(u.quadra) : '—';
          if (!gps[g]) gps[g] = [];
          gps[g].push(u);
        }
        const _flo = g => { const n = parseFloat(g); if (!isNaN(n)) return n; const gl = g.toLowerCase(); if (gl.includes('cob')||gl.includes('pent')||gl.includes('ático')||gl.includes('atico')) return 999; if (gl.includes('térr')||gl.includes('terr')) return 0; return 0; };
        const gKeys = Object.keys(gps).sort((a, b) => _flo(b) - _flo(a));
        html.push(renderEspelhoPredio(gKeys, gps));
      } else {
        const predioGroups = detectarPredio(units);
        if (predioGroups) {
          html.push(renderPredio(units, predioGroups));
        } else {
          const quadras = {};
          for (const u of units) {
            const q = u.quadra || '—';
            if (!quadras[q]) quadras[q] = [];
            quadras[q].push(u);
          }
          html.push(`<div class="grade-section">`);
          for (const [q, lotes] of Object.entries(quadras)) {
            if (Object.keys(quadras).length > 1) {
              html.push(`<div class="grade-titulo">${q !== '—' ? 'Quadra ' + q : 'Lotes'}</div>`);
            }
            html.push(`<div class="grade" style="margin-bottom:16px">`);
            for (const u of lotes) {
              const tipInfo = [
                u.quadra ? `Quadra ${u.quadra}` : '',
                `Lote ${u.lote}`,
                u.area_m2 ? `${u.area_m2}m²` : '',
                u.preco ? fmt0.format(u.preco) : '',
                statusLabel(u.status)
              ].filter(Boolean).join('<br>');
              html.push(`<div class="tile ${u.status}" onclick="abrirSimulacao(${u.id})" title="Clique para simular">
                <div class="lote-num">${u.lote}</div>
                ${u.quadra ? `<div class="quadra">Q${u.quadra}</div>` : ''}
                <div class="tip2">${tipInfo}</div>
              </div>`);
            }
            html.push(`</div>`);
          }
          html.push(`</div>`);
        }
      }
      document.getElementById('conteudo').innerHTML = html.join('');
    }

  } catch(e) {
    document.getElementById('conteudo').innerHTML = `<div class="erro">⚠️ Erro ao carregar: ${e.message}</div>`;
  }
}

function ajustarMarcadores() {
  const wrap = document.getElementById('mapa-wrap');
  const img  = document.getElementById('mapa-img');
  const cont = document.getElementById('marcadores');
  if (!wrap || !img || !cont || !window._units) return;

  const w = img.offsetWidth || img.naturalWidth;
  const h = img.offsetHeight || img.naturalHeight;
  if (!w || !h) return;

  // Escala a bolinha proporcionalmente à largura exibida da imagem.
  // Referência: tamanho configurado é adequado para ~900px de largura.
  // Em telas menores (celular) reduz proporcionalmente; nunca aumenta além do configurado.
  const displayScale = Math.min(1, w / 900);
  const sz = Math.round(Math.max(10, Math.min(120, _markerSize * displayScale)));
  const fs = Math.round(Math.max(5,  Math.min(28,  sz * 0.42)));

  const html = [];
  for (const u of (window._comPosicao || [])) {
    const x = (u.mapa_x / 100) * w;
    const y = (u.mapa_y / 100) * h;
    const tipInfo = [
      u.quadra ? `Quadra ${u.quadra}` : '',
      `Lote ${u.lote}`,
      u.area_m2 ? `${u.area_m2}m²` : '',
      u.preco ? fmt0.format(u.preco) : '',
      statusLabel(u.status)
    ].filter(Boolean).join('<br>');
    html.push(`<div class="marcador ${u.status}" style="left:${x}px;top:${y}px;width:${sz}px;height:${sz}px;font-size:${fs}px" onclick="abrirSimulacao(${u.id})">
      ${/^\d+$/.test(u.lote) ? String(parseInt(u.lote, 10)) : u.lote}
      <div class="tip">${tipInfo}</div>
    </div>`);
  }
  cont.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none';
  cont.innerHTML = html.join('');
  cont.querySelectorAll('.marcador').forEach(m => m.style.pointerEvents = 'auto');
}

function renderEspelhoPredio(grupoKeys, grupos) {
  if (!grupoKeys.length) return '<div style="padding:40px;text-align:center;color:#64748b">Nenhuma unidade encontrada</div>';

  const extractNum = lote => {
    const m = String(lote).match(/\b(\d{1,4}[A-Za-z]?)\b/);
    return m ? m[1] : String(lote).split(/[\s-]/)[0];
  };
  const extractTip = lote => {
    const parts = String(lote).split(/\s*-\s*/);
    return parts.length > 1 ? parts.slice(1).filter(p => /[a-zA-ZÀ-ú]/.test(p)).join(' - ') : '';
  };
  const _flo = g => { const n = parseFloat(g); if (!isNaN(n)) return n; const gl = g.toLowerCase(); if (gl.includes('cob')||gl.includes('pent')||gl.includes('ático')||gl.includes('atico')) return 999; if (gl.includes('térr')||gl.includes('terr')) return 0; return 0; };

  grupoKeys.forEach(g => {
    grupos[g].sort((a, b) => {
      const na = parseFloat(extractNum(a.lote)), nb = parseFloat(extractNum(b.lote));
      return (!isNaN(na) && !isNaN(nb)) ? na - nb : String(a.lote).localeCompare(String(b.lote), 'pt-BR', {numeric: true});
    });
  });

  const maxCols = Math.max(...grupoKeys.map(g => grupos[g].length));
  const positions = Array.from({length: maxCols}, (_, i) => i);

  const colLabels = positions.map(i => {
    for (const g of grupoKeys) { if (grupos[g][i]) return extractNum(grupos[g][i].lote); }
    return String(i + 1).padStart(2, '0');
  });
  const colTips = positions.map(i => {
    for (const g of grupoKeys) {
      if (grupos[g][i]) { const u = grupos[g][i]; return u.tipologia || extractTip(u.lote); }
    }
    return '';
  });

  const stClr = { disponivel:'#4ade80', reservado:'#fbbf24', vendido:'#f87171', indisponivel:'#94a3b8' };
  const bgMap  = { disponivel:'#14532d', reservado:'#78350f', vendido:'#7f1d1d', indisponivel:'#1e293b' };
  const bdMap  = { disponivel:'#22c55e', reservado:'#f59e0b', vendido:'#ef4444', indisponivel:'#475569' };

  const thead = `<tr>
    <th style="padding:0 12px 10px 0;min-width:64px"></th>
    ${positions.map(i => {
      const tip = colTips[i];
      return `<th style="padding:0 4px 10px;text-align:center;min-width:72px;max-width:72px">
        <div style="font-size:11px;font-weight:700;color:#e2e8f0">${colLabels[i]}</div>
        ${tip ? `<div style="font-size:8px;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:68px">${tip}</div>` : ''}
      </th>`;
    }).join('')}
  </tr>`;

  const rows = grupoKeys.map(g => {
    const unitsOnFloor = grupos[g];
    const fo = _flo(g);
    const andLabel = fo === 999 ? 'Cob' : (fo === 0 ? 'Tér' : `${fo}°`);
    const cntG = {
      d: unitsOnFloor.filter(u => u.status === 'disponivel').length,
      r: unitsOnFloor.filter(u => u.status === 'reservado').length,
      v: unitsOnFloor.filter(u => u.status === 'vendido').length,
      i: unitsOnFloor.filter(u => u.status === 'indisponivel').length,
    };

    const cells = positions.map(i => {
      const u = unitsOnFloor[i];
      if (!u) return `<td style="padding:3px 4px"><div style="width:68px;height:58px"></div></td>`;
      const num = extractNum(u.lote);
      const tip = u.tipologia || extractTip(u.lote);
      const clr = stClr[u.status] || '#94a3b8';
      const bg  = bgMap[u.status]  || '#1e293b';
      const bd  = bdMap[u.status]  || '#475569';
      const tooltipLines = [`Apto ${num}`, tip, u.area_m2 ? u.area_m2 + 'm²' : '', u.preco && u.status === 'disponivel' ? fmt0.format(u.preco) : ''].filter(Boolean).join(' · ');
      return `<td style="padding:3px 4px">
        <div onclick="abrirSimulacao(${u.id})" title="${tooltipLines}" style="
          width:68px;height:58px;border-radius:8px;cursor:pointer;
          background:${bg};border:1.5px solid ${bd};
          display:flex;flex-direction:column;align-items:center;justify-content:center;
          transition:transform .12s;
        " onmouseover="this.style.transform='translateY(-3px)'" onmouseout="this.style.transform=''">
          <div style="font-size:14px;font-weight:700;color:${clr};line-height:1">${num}</div>
          ${tip ? `<div style="font-size:8px;color:${clr};opacity:.7;margin-top:1px;max-width:62px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${tip}</div>` : ''}
          ${u.area_m2 ? `<div style="font-size:9px;color:${clr};opacity:.65;margin-top:1px">${u.area_m2}m²</div>` : ''}
        </div>
      </td>`;
    }).join('');

    return `<tr>
      <td style="padding:3px 12px 3px 0;vertical-align:middle;border-right:2px solid #1e293b">
        <div style="text-align:right;padding-right:6px;white-space:nowrap">
          <div style="font-size:12px;font-weight:700;color:#f1f5f9">${andLabel}</div>
          <div style="font-size:8px;color:#475569;margin-top:2px;line-height:1.5">
            <span style="color:#4ade80">${cntG.d}▪</span> <span style="color:#fbbf24">${cntG.r}▪</span> <span style="color:#f87171">${cntG.v}▪</span>${cntG.i ? ` <span style="color:#64748b">${cntG.i}▪</span>` : ''}
          </div>
        </div>
      </td>
      ${cells}
    </tr>`;
  }).join('');

  return `<div style="overflow-x:auto;padding-bottom:8px">
    <table style="border-collapse:separate;border-spacing:0 3px;min-width:max-content">
      <thead>${thead}</thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function detectarPredio(units) {
  // Retorna grupos por andar se as unidades parecem apartamentos (ex: 401, 402, 501...)
  // ou null se parece loteamento
  const semQuadra = units.filter(u => !u.quadra || u.quadra === '0' || u.quadra === '');
  if (semQuadra.length < units.length * 0.9) return null;

  const nums = units.map(u => ({ u, n: parseInt(String(u.lote || '').trim(), 10) }))
                     .filter(x => !isNaN(x.n));
  if (nums.length < units.length * 0.85) return null;

  const floorGroups = {};
  for (const { u, n } of nums) {
    if (n < 100 || n > 9999) return null;
    const floor = Math.floor(n / 100);
    const unit  = n % 100;
    if (floor < 1 || floor > 60 || unit < 1 || unit > 50) return null;
    if (!floorGroups[floor]) floorGroups[floor] = [];
    floorGroups[floor].push(u);
  }

  const floors = Object.keys(floorGroups);
  if (floors.length < 2) return null;

  // Maioria dos andares deve ter pelo menos 2 unidades
  const comMultiplos = floors.filter(f => floorGroups[f].length >= 2);
  if (comMultiplos.length < Math.max(1, floors.length * 0.5)) return null;

  return floorGroups;
}

function renderPredio(units, floorGroups) {
  const floors = Object.keys(floorGroups).map(Number).sort((a, b) => b - a);
  const tot  = units.length;
  const vend = units.filter(u => u.status === 'vendido' || u.status === 'entregue').length;
  const res  = units.filter(u => u.status === 'reservado').length;
  const disp = units.filter(u => u.status === 'disponivel').length;
  const topFloor = floors[0];

  const html = [`<div class="predio-wrap">`,
    `<div class="predio-vso">`,
    `<div class="predio-vso-bar">`,
    `<div style="width:${tot?vend/tot*100:0}%;background:#dc2626"></div>`,
    `<div style="width:${tot?res/tot*100:0}%;background:#d97706"></div>`,
    `<div style="width:${tot?disp/tot*100:0}%;background:#16a34a"></div>`,
    `</div>`,
    `<div class="predio-vso-labels">`,
    `<span style="color:#fca5a5">${vend} vendido${vend!==1?'s':''}</span>`,
    `<span style="color:#fbbf24">${res} reservado${res!==1?'s':''}</span>`,
    `<span style="color:#4ade80">${disp} disponível${disp!==1?'is':''}</span>`,
    `</div></div>`,
    `<div class="predio-frame">`
  ];

  for (const floor of floors) {
    const unitsOnFloor = (floorGroups[floor] || []).slice()
      .sort((a, b) => parseInt(a.lote, 10) - parseInt(b.lote, 10));
    const tag = floor === topFloor ? 'Cobertura' : 'Andar';

    html.push(`<div class="predio-andar">
      <div class="predio-label"><span class="predio-num">${floor}°</span><span class="predio-tag">${tag}</span></div>
      <div class="predio-units">`);

    for (const u of unitsOnFloor) {
      const tipInfo = [
        `Apto ${u.lote}`,
        u.area_m2 ? `${u.area_m2}m²` : '',
        u.preco && u.status === 'disponivel' ? fmt0.format(u.preco) : (u.preco ? 'Sob consulta' : ''),
        statusLabel(u.status)
      ].filter(Boolean).join('<br>');

      html.push(`<div class="predio-unit ${u.status}" onclick="abrirSimulacao(${u.id})">
        <div class="predio-unit-num">${u.lote}</div>
        ${u.area_m2 ? `<div class="predio-unit-area">${u.area_m2}m²</div>` : ''}
        <div class="tip2">${tipInfo}</div>
      </div>`);
    }

    html.push(`</div></div>`);
  }

  html.push(`</div></div>`);
  return html.join('\n');
}

let _mapaScale = 1, _mapaTX = 0, _mapaTY = 0;

function initMapaPinchZoom() {
  const outer = document.getElementById('mapa-outer');
  const wrap  = document.getElementById('mapa-wrap');
  if (!outer || !wrap) return;
  _mapaScale = 1; _mapaTX = 0; _mapaTY = 0;
  wrap.style.transform = '';

  let pinchDist0 = null, scale0 = 1, mid0 = null, tx0 = 0, ty0 = 0;
  let panStart = null, panTX0 = 0, panTY0 = 0;

  function getDist(t) {
    return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  }
  function getMid(t) {
    return { x: (t[0].clientX + t[1].clientX) / 2, y: (t[0].clientY + t[1].clientY) / 2 };
  }
  function clamp(tx, ty, s) {
    const iW = outer.offsetWidth, iH = outer.offsetHeight;
    return {
      tx: Math.min(0, Math.max(iW * (1 - s), tx)),
      ty: Math.min(0, Math.max(iH * (1 - s), ty))
    };
  }
  function applyTransform() {
    wrap.style.transform = `translate(${_mapaTX}px,${_mapaTY}px) scale(${_mapaScale})`;
  }

  outer.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      e.preventDefault();
      pinchDist0 = getDist(e.touches);
      scale0 = _mapaScale; mid0 = getMid(e.touches);
      tx0 = _mapaTX; ty0 = _mapaTY;
      panStart = null;
    } else if (e.touches.length === 1) {
      if (_mapaScale > 1) {
        panStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        panTX0 = _mapaTX; panTY0 = _mapaTY;
      }
      pinchDist0 = null;
    }
  }, { passive: false });

  outer.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && pinchDist0 !== null) {
      e.preventDefault();
      const newScale = Math.max(1, Math.min(6, scale0 * (getDist(e.touches) / pinchDist0)));
      const mid1 = getMid(e.touches);
      const rect  = outer.getBoundingClientRect();
      const focalLX = (mid0.x - rect.left - tx0) / scale0;
      const focalLY = (mid0.y - rect.top  - ty0) / scale0;
      const c = clamp(mid1.x - rect.left - newScale * focalLX,
                      mid1.y - rect.top  - newScale * focalLY, newScale);
      _mapaScale = newScale; _mapaTX = c.tx; _mapaTY = c.ty;
      applyTransform();
    } else if (e.touches.length === 1 && panStart && _mapaScale > 1) {
      e.preventDefault();
      const c = clamp(panTX0 + e.touches[0].clientX - panStart.x,
                      panTY0 + e.touches[0].clientY - panStart.y, _mapaScale);
      _mapaTX = c.tx; _mapaTY = c.ty;
      applyTransform();
    }
  }, { passive: false });

  outer.addEventListener('touchend', e => {
    if (e.touches.length < 2) {
      pinchDist0 = null;
      // transição de pinch → pan: registra o dedo restante como início do pan
      if (e.touches.length === 1 && _mapaScale > 1) {
        panStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        panTX0 = _mapaTX; panTY0 = _mapaTY;
      }
    }
    if (e.touches.length === 0) panStart = null;
    if (_mapaScale <= 1.05) {
      _mapaScale = 1; _mapaTX = 0; _mapaTY = 0;
      wrap.style.transform = '';
    }
  }, { passive: true });

  // Zoom com scroll do mouse (desktop) — focal point no cursor
  let _wRAF = null, _wAccum = 0, _wCX = 0, _wCY = 0;
  outer.addEventListener('wheel', function(e) {
    e.preventDefault();
    let dy = e.deltaY;
    if (e.deltaMode === 1) dy *= 20;
    if (e.deltaMode === 2) dy *= 400;
    _wAccum += dy; _wCX = e.clientX; _wCY = e.clientY;
    if (!_wRAF) {
      _wRAF = requestAnimationFrame(function() {
        const rect = outer.getBoundingClientRect();
        const focalLX = (_wCX - rect.left - _mapaTX) / _mapaScale;
        const focalLY = (_wCY - rect.top  - _mapaTY) / _mapaScale;
        const newScale = Math.max(1, Math.min(6, _mapaScale * Math.pow(0.999, _wAccum)));
        const c = clamp(_wCX - rect.left - newScale * focalLX,
                        _wCY - rect.top  - newScale * focalLY, newScale);
        _mapaScale = newScale; _mapaTX = c.tx; _mapaTY = c.ty;
        if (_mapaScale <= 1.01) { _mapaScale = 1; _mapaTX = 0; _mapaTY = 0; wrap.style.transform = ''; }
        else applyTransform();
        _wAccum = 0; _wRAF = null;
      });
    }
  }, { passive: false });

  // Pan por clique+arraste (desktop)
  let _mPanStart = null, _mPanTX0 = 0, _mPanTY0 = 0, _mDidPan = false;

  outer.addEventListener('mousedown', function(e) {
    if (e.button !== 0) return;
    _mPanStart = { x: e.clientX, y: e.clientY };
    _mPanTX0 = _mapaTX; _mPanTY0 = _mapaTY;
    _mDidPan = false;
    outer.style.cursor = 'grabbing';
    outer.style.userSelect = 'none';
  });

  document.addEventListener('mousemove', function(e) {
    if (!_mPanStart) return;
    const dx = e.clientX - _mPanStart.x;
    const dy = e.clientY - _mPanStart.y;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) _mDidPan = true;
    if (_mapaScale > 1) {
      const c = clamp(_mPanTX0 + dx, _mPanTY0 + dy, _mapaScale);
      _mapaTX = c.tx; _mapaTY = c.ty;
      applyTransform();
    }
  });

  document.addEventListener('mouseup', function() {
    if (!_mPanStart) return;
    _mPanStart = null;
    outer.style.cursor = '';
    outer.style.userSelect = '';
  });

  // Suprimir click em filhos (marcadores) se foi arraste
  outer.addEventListener('click', function(e) {
    if (_mDidPan) { _mDidPan = false; e.stopPropagation(); e.preventDefault(); }
  }, true);
}

async function baixarTabelaPDF() {
  const units = window._units || [];
  if (!units.length) return;
  const p = _simParams;
  const isLoteamento = _empTipo !== 'predio';

  // Carregar jsPDF + autotable lazily
  if (!window.jspdf) {
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
      s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
  }
  if (!window.jspdf?.jsPDF?.prototype?.autoTable) {
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js';
      s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
  const pageW = doc.internal.pageSize.getWidth();

  // Cabeçalho
  doc.setFontSize(14); doc.setFont('helvetica','bold');
  doc.text(_empNome, 14, 14);
  doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(120);
  const titulo = p?.titulo || 'Tabela de Lançamento';
  doc.text(titulo, pageW - 14, 10, { align: 'right' });
  doc.text(new Date().toLocaleDateString('pt-BR'), pageW - 14, 15, { align: 'right' });
  doc.setTextColor(0);

  // Ordenar unidades
  const _flo = g => { const n = parseFloat(g); if (!isNaN(n)) return n; const gl = (g||'').toLowerCase(); if (gl.includes('térr')||gl.includes('terr')) return 0; return 0; };
  const sortedUnits = [...units].sort((a, b) => {
    if (!isLoteamento) {
      const fa = _flo(String(a.quadra||'')), fb = _flo(String(b.quadra||''));
      if (fa !== fb) return fb - fa;
      return parseFloat(String(a.lote).replace(/\D/g,'')) - parseFloat(String(b.lote).replace(/\D/g,''));
    }
    const qa = String(a.quadra||''), qb = String(b.quadra||'');
    const na = parseFloat(qa), nb = parseFloat(qb);
    const qcmp = (!isNaN(na)&&!isNaN(nb)) ? na-nb : qa.localeCompare(qb,'pt-BR',{numeric:true});
    if (qcmp !== 0) return qcmp;
    return parseFloat(String(a.lote||'').replace(/\D/g,'')||'0') - parseFloat(String(b.lote||'').replace(/\D/g,'')||'0');
  });

  const fmtR = n => n == null ? '—' : 'R$ ' + n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  const fmtA = n => n == null ? '—' : n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' m²';

  const entFixo  = p?.entrada_tipo === 'valor';
  const entParcN = p?.entrada_parc || 1;
  const nRef     = p?.nRef || 0;
  const condicoes = p?.condicoes || [];

  // Colunas
  const head = isLoteamento
    ? ['Quadra','Lote','Área','Valor', ...(p?['Entrada']:[]), ...(nRef>0?['Balão (cada)']:[]), ...condicoes.map(c=>c.label||c.nParc+'x'), 'Status']
    : ['Andar','Unidade','Tipologia','Área','Valor', ...(p?['Entrada']:[]), ...(nRef>0?['Balão (cada)']:[]), ...condicoes.map(c=>c.label||c.nParc+'x'), 'Status'];

  const statusLabel = s => s==='vendido'?'VENDIDO':s==='reservado'?'RESERVADO':s==='indisponivel'?'INDISPONÍVEL':'DISPONÍVEL';
  const statusClr   = s => s==='vendido'?[146,64,14]:s==='reservado'?[217,119,6]:s==='indisponivel'?[100,116,139]:[22,163,74];

  const _flo2 = g => { const n = parseFloat(g); if (!isNaN(n)) return n; const gl=(g||'').toLowerCase(); return (gl.includes('térr')||gl.includes('terr'))?0:0; };

  const body = sortedUnits.map(u => {
    const P = u.preco;
    let entCell='—', refCell='—', condCells=[];
    if (P && p) {
      const entV     = entFixo ? (p.entrada_valor||0) : P * ((p.entrada_pct||0)/100);
      const totalRef = P * ((p.pRef||0)/100);
      const refVal   = nRef>0 ? totalRef/nRef : 0;
      const saldo    = P - entV - totalRef;
      entCell = entParcN > 1
        ? fmtR(entV) + ` (${entParcN}x ${fmtR(entV/entParcN)})`
        : fmtR(entV);
      refCell = nRef>0 ? fmtR(refVal) : '—';
      condCells = condicoes.map(c => fmtR(calcPMT(saldo, c.nParc, c.juros||0)) + '/mês');
    } else {
      condCells = condicoes.map(() => '—');
    }

    const andarLabel = (() => { const fo=_flo2(String(u.quadra||'')); return fo===0&&String(u.quadra||'').match(/t[eé]r/i)?'Térreo':!isNaN(parseFloat(u.quadra))?`${parseFloat(u.quadra)}°`:String(u.quadra||'—'); })();
    const loteNum = String(u.lote||'').match(/\b(\d{1,4}[A-Za-z]?)\b/)?.[1] || String(u.lote||'');

    const row = isLoteamento
      ? [String(u.quadra||'—'), loteNum, fmtA(u.area_m2), fmtR(P), ...(p?[entCell]:[]), ...(nRef>0?[refCell]:[]), ...condCells, statusLabel(u.status)]
      : [andarLabel, loteNum, u.tipologia||'', fmtA(u.area_m2), fmtR(P), ...(p?[entCell]:[]), ...(nRef>0?[refCell]:[]), ...condCells, statusLabel(u.status)];

    return { data: row, status: u.status };
  });

  const statusColIdx = head.length - 1;

  doc.autoTable({
    startY: 20,
    head: [head],
    body: body.map(r => r.data),
    theme: 'grid',
    headStyles: { fillColor: [15,23,42], textColor: 255, fontSize: 7, fontStyle: 'bold', halign: 'center' },
    bodyStyles: { fontSize: 6.5, cellPadding: 2 },
    columnStyles: {
      [head.indexOf('Valor')]: { halign: 'right' },
      ...(p ? { [head.indexOf('Entrada')]: { halign: 'right' } } : {}),
      ...(nRef > 0 ? { [head.indexOf('Balão (cada)')]: { halign: 'right' } } : {}),
      ...Object.fromEntries(condicoes.map((_, i) => [head.length - 1 - condicoes.length + i, { halign: 'right' }])),
      [statusColIdx]: { halign: 'center', fontStyle: 'bold' }
    },
    didParseCell: data => {
      if (data.section === 'body') {
        const rowIdx = data.row.index;
        const st = body[rowIdx]?.status;
        if (data.column.index === statusColIdx) {
          const [r,g,b] = statusClr(st);
          data.cell.styles.fillColor = [r,g,b];
          data.cell.styles.textColor = [255,255,255];
          data.cell.styles.fontSize  = 5.5;
        }
        if (st === 'vendido')      { data.cell.styles.fillColor = [254,243,199]; }
        else if (st === 'reservado')   { data.cell.styles.fillColor = [255,251,235]; }
        else if (st === 'indisponivel'){ data.cell.styles.fillColor = [241,245,249]; data.cell.styles.textColor=[100,116,139]; }
        if (data.column.index === statusColIdx) {
          const [r,g,b] = statusClr(st);
          data.cell.styles.fillColor = [r,g,b];
          data.cell.styles.textColor = [255,255,255];
        }
      }
    },
    margin: { top: 22, left: 10, right: 10 }
  });

  // Rodapé resumo
  const nDisp=units.filter(u=>u.status==='disponivel').length;
  const nRes=units.filter(u=>u.status==='reservado').length;
  const nVend=units.filter(u=>u.status==='vendido').length;
  const nIndisp=units.filter(u=>u.status==='indisponivel').length;
  const finalY = doc.lastAutoTable.finalY + 4;
  doc.setFontSize(7); doc.setTextColor(80);
  doc.text(`Total: ${units.length}  |  Disponível: ${nDisp}  |  Reservado: ${nRes}  |  Vendido: ${nVend}${nIndisp?'  |  Indisponível: '+nIndisp:''}`, 14, finalY);

  const nomeArq = (_empNome||'tabela').replace(/[^a-zA-Z0-9À-ú\s]/g,'').trim().replace(/\s+/g,'_');
  doc.save(`Tabela_${nomeArq}_${new Date().toISOString().slice(0,10)}.pdf`);
}

function exportarTabelaEspelho() {
  const units = window._units || [];
  if (!units.length) return;

  const p = _simParams;
  const isLoteamento = _empTipo !== 'predio';

  // Formatters idênticos ao sistema interno
  const fmt2 = n => n == null ? '—' : 'R$ ' + n.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
  const fmtN = n => n == null ? '—' : n.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' m²';

  // Ordenação idêntica ao sistema interno
  const floorOrder = q => {
    const n = parseFloat(q);
    if (!isNaN(n)) return n;
    const ql = String(q).toLowerCase();
    if (ql.includes('térr') || ql.includes('terr')) return 0;
    return Infinity;
  };
  const sortedUnits = [...units].sort((a, b) => {
    const qa = String(a.quadra||''), qb = String(b.quadra||'');
    const na = parseFloat(qa), nb = parseFloat(qb);
    const qcmp = (!isNaN(na) && !isNaN(nb)) ? na - nb : qa.localeCompare(qb, 'pt-BR', {numeric:true, sensitivity:'base'});
    if (qcmp !== 0) return qcmp;
    const la = parseFloat(String(a.lote||'').replace(/\D/g,'')||'0');
    const lb = parseFloat(String(b.lote||'').replace(/\D/g,'')||'0');
    return (!isNaN(la) && !isNaN(lb)) ? la - lb : String(a.lote||'').localeCompare(String(b.lote||''), 'pt-BR', {numeric:true});
  });

  // Params — espelhoParams armazena pct como 0-100
  const condicoes = p?.condicoes || [{label:'60x sem juros', nParc:60, juros:0}];
  const nRef      = p?.nRef || 0;
  const entFixo   = p?.entrada_tipo === 'valor';
  const entParcN  = p?.entrada_parc || 1;
  const refPct    = ((p?.pRef || 0)).toFixed(0);

  const entradaSubHd = !p ? '' : entFixo
    ? (entParcN > 1
        ? `R$ ${(p.entrada_valor||0).toLocaleString('pt-BR')} · ${entParcN}x R$ ${((p.entrada_valor||0)/entParcN).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}`
        : `R$ ${(p.entrada_valor||0).toLocaleString('pt-BR')} · à vista`)
    : (entParcN > 1
        ? `${(p.entrada_pct||0).toFixed(0)}% · ${entParcN}x`
        : `${(p.entrada_pct||0).toFixed(0)}% · à vista`);

  const condCols  = condicoes.map(c =>
    `<th class="right">${c.label||c.nParc+'x'}<span class="sub">${c.juros>0?c.juros.toFixed(2)+'% a.m.':'sem juros'}</span></th>`
  ).join('');
  const refColHd  = nRef > 0
    ? `<th class="right">Balões ${nRef}<span class="sub">${refPct}% do valor · cada</span></th>` : '';

  const extractNum = lote => { const m = String(lote).match(/\b(\d{1,4}[A-Za-z]?)\b/); return m ? m[1] : String(lote).split(/[\s-]/)[0]; };
  const extractTip = lote => { const parts = String(lote).split(/\s*-\s*/); return parts.length > 1 ? parts.slice(1).filter(pt => /[a-zA-ZÀ-ú]/.test(pt)).join(' - ') : ''; };
  const entSingleLine = isLoteamento && entFixo && entParcN > 1;

  const rows = sortedUnits.map(u => {
    const lote = String(u.lote || '');
    const num  = extractNum(lote);
    const tip  = u.tipologia || extractTip(lote);
    const q    = u.quadra != null ? String(u.quadra) : '—';
    const fo   = floorOrder(q);
    const andarLabel = fo === 0 ? 'Térreo' : !isNaN(fo) ? `${fo}º andar` : q;
    const P    = u.preco;
    let entCell = '', refCell = '', condCells = '';

    if (P && p) {
      const entV     = entFixo ? (p.entrada_valor || 0) : P * ((p.entrada_pct || 0) / 100);
      const totalRef = P * ((p.pRef || 0) / 100);
      const refVal   = nRef > 0 ? totalRef / nRef : 0;
      const saldo    = P - entV - totalRef;

      if (entParcN > 1 && !entSingleLine) {
        const parcEnt = entV / entParcN;
        entCell = `${fmt2(entV)}<br><span style="font-size:9px;color:#6b7280">${entParcN}x ${fmt2(parcEnt)}</span>`;
      } else {
        entCell = fmt2(entV);
      }
      refCell = nRef > 0 ? fmt2(refVal) : '—';

      const cp = isLoteamento ? '2px 4px' : '5px 10px';
      condCells = condicoes.map(c => {
        const pmv = calcPMT(saldo, c.nParc, c.juros);
        const totalC = entV + totalRef + c.nParc * pmv;
        const ok = !c.juros && Math.abs(totalC - P) < 0.10;
        const chk = !c.juros ? `<span style="font-size:9px;color:${ok?'#166534':'#991b1b'};font-weight:700">${ok?'✓':'⚠'}</span>` : '';
        return `<td style="padding:${cp};font-size:${isLoteamento?'10px':'12px'};font-weight:700;text-align:right;white-space:nowrap">${fmt2(pmv)} ${chk}</td>`;
      }).join('');
    } else {
      const cp = isLoteamento ? '2px 4px' : '5px 10px';
      condCells = condicoes.map(() => `<td style="padding:${cp};text-align:right;color:#9ca3af">—</td>`).join('');
    }

    const st       = u.status || 'disponivel';
    const isRes    = st === 'reservado';
    const isVend   = st === 'vendido';
    const isIndisp = st === 'indisponivel';
    const rowStyle = isVend
      ? 'background:#fde68a;border-bottom:2px solid #f59e0b;border-left:4px solid #92400e'
      : isRes
        ? 'background:#fef3c7;border-bottom:2px solid #fcd34d;border-left:4px solid #f59e0b'
        : isIndisp
          ? 'background:#f0f4f8;border-bottom:2px solid #94a3b8;border-left:4px solid #64748b'
          : 'background:#ffffff;border-bottom:2px solid #d1d5db;border-left:4px solid transparent';
    const textDeco  = isVend ? 'text-decoration:line-through' : isIndisp ? 'text-decoration:underline;opacity:.65' : '';
    const numColor  = isRes ? '#92400e' : isVend ? '#78350f' : isIndisp ? '#64748b' : '#111827';
    const textColor = isRes ? 'color:#92400e' : isVend ? 'color:#78350f' : isIndisp ? 'color:#64748b' : 'color:#374151';
    const badgeBg   = isVend ? '#92400e' : isRes ? '#d97706' : isIndisp ? '#64748b' : '#16a34a';
    const badgeTxt  = isVend ? 'VENDIDO' : isRes ? 'RESERVADO' : isIndisp ? 'INDISPONÍVEL' : 'DISPONÍVEL';
    const badgeExtra = isRes ? 'box-shadow:0 0 0 2px #f59e0b' : isVend ? 'box-shadow:0 0 0 2px #92400e' : '';
    const badge = `<span style="display:inline-block;padding:2px 8px;border-radius:99px;font-size:9px;font-weight:800;background:${badgeBg};color:#fff;letter-spacing:.3px;${badgeExtra}">${badgeTxt}</span>`;

    if (isLoteamento) {
      return `<tr style="${rowStyle}">
        <td style="padding:2px 4px;font-size:9px;white-space:nowrap;${textColor};${textDeco}">${q}</td>
        <td style="padding:2px 4px;font-size:12px;font-weight:900;white-space:nowrap;color:${numColor};${textDeco}">${num}</td>
        <td style="padding:2px 4px;font-size:9px;text-align:right;white-space:nowrap;${textColor};${textDeco}">${fmtN(u.area_m2)}</td>
        <td style="padding:2px 4px;font-size:10px;font-weight:800;text-align:right;white-space:nowrap;color:${numColor};${textDeco}">${fmt2(P)}</td>
        <td style="padding:2px 4px;font-size:10px;text-align:right;white-space:nowrap;${textColor};${textDeco}">${entCell}</td>
        ${nRef>0?`<td style="padding:2px 4px;font-size:10px;text-align:right;white-space:nowrap;${textColor};${textDeco}">${refCell}</td>`:''}
        ${condCells}
        <td style="padding:2px 4px;text-align:center">${badge}</td>
      </tr>`;
    } else {
      return `<tr style="${rowStyle}">
        <td style="padding:5px 10px;font-size:11px;white-space:nowrap;${textColor};${textDeco}">${andarLabel}</td>
        <td style="padding:5px 10px;font-size:15px;font-weight:900;white-space:nowrap;color:${numColor};${textDeco}">${num}</td>
        <td style="padding:5px 10px;font-size:10.5px;${isRes?'color:#92400e':'color:#6b7280'};${textDeco}">${tip}</td>
        <td style="padding:5px 10px;font-size:12px;text-align:right;white-space:nowrap;${textColor};${textDeco}">${fmtN(u.area_m2)}</td>
        <td style="padding:5px 10px;font-size:13px;font-weight:800;text-align:right;white-space:nowrap;color:${numColor};${textDeco}">${fmt2(P)}</td>
        <td style="padding:5px 10px;font-size:12px;text-align:right;white-space:nowrap;${textColor};${textDeco}">${entCell}</td>
        ${nRef>0?`<td style="padding:5px 10px;font-size:12px;text-align:right;white-space:nowrap;${textColor};${textDeco}">${refCell}</td>`:''}
        ${condCells}
        <td style="padding:5px 10px;text-align:center">${badge}</td>
      </tr>`;
    }
  }).join('');

  const nDisp   = units.filter(u=>u.status==='disponivel').length;
  const nRes    = units.filter(u=>u.status==='reservado').length;
  const nVend   = units.filter(u=>u.status==='vendido').length;
  const nIndisp = units.filter(u=>u.status==='indisponivel').length;
  const total   = units.length;

  const condsDesc = condicoes.map(c =>
    `${c.label||c.nParc+'x'}${c.juros>0?' c/ '+c.juros.toFixed(2)+'% a.m.':' sem juros'}`
  ).join(' · ');

  const now    = new Date().toLocaleDateString('pt-BR');
  const titulo = p?.titulo || 'Tabela de Lançamento';
  const obsLines = (p?.obs||'').split('\n').filter(Boolean);

  const entHdCell = p ? `<th class="right">Entrada<span class="sub">${entradaSubHd}</span></th>` : '';

  const html = `<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="UTF-8">
<title>Tabela de Vendas — ${_empNome}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, Helvetica, sans-serif; background: #fff; color: #111; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; color-scheme: light; }
  @page { size: A4 landscape; margin: ${isLoteamento ? '3mm 5mm' : '8mm 10mm'}; }
  @media print { .no-print { display: none !important; } * { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: ${isLoteamento ? '3px' : '10px'}; padding-bottom: ${isLoteamento ? '3px' : '8px'}; border-bottom: 3px solid #111; }
  .header-left h1 { font-size: ${isLoteamento ? '11px' : '17px'}; font-weight: 900; letter-spacing: -.5px; color: #000; }
  .header-left p  { font-size: ${isLoteamento ? '7px' : '10px'}; color: #374151; margin-top: 1px; }
  .header-right   { text-align: right; }
  .header-right .data  { font-size: ${isLoteamento ? '10px' : '15px'}; font-weight: 900; color: #000; }
  .header-right .titulo { font-size: ${isLoteamento ? '7px' : '8px'}; color: #374151; text-transform: uppercase; letter-spacing: 1px; }
  table { width: 100%; border-collapse: collapse; font-size: ${isLoteamento ? '8px' : '10.5px'}; }
  thead th { background: #0f172a !important; color: #ffffff !important; padding: ${isLoteamento ? '4px 4px 3px' : '7px 8px 6px'}; font-size: ${isLoteamento ? '7.5px' : '9.5px'}; font-weight: 800; text-transform: uppercase; letter-spacing: .4px; white-space: nowrap; vertical-align: bottom; border: 1px solid #0f172a; }
  thead th .sub { display: block; font-size: ${isLoteamento ? '6.5px' : '8.5px'}; font-weight: 400; opacity: .75; text-transform: none; letter-spacing: 0; margin-top: 1px; color: #cbd5e1; }
  thead th.right  { text-align: right; }
  thead th.center { text-align: center; }
  tbody tr { line-height: 1; }
  .resumo { display: flex; gap: 4px; margin-top: ${isLoteamento ? '3px' : '8px'}; }
  .resumo-card { flex: 1; border: 1px solid #e5e7eb; border-radius: 4px; padding: ${isLoteamento ? '2px 4px' : '5px 10px'}; text-align: center; }
  .resumo-card .val { font-size: ${isLoteamento ? '10px' : '15px'}; font-weight: 900; }
  .resumo-card .lbl { font-size: ${isLoteamento ? '6px' : '7px'}; color: #6b7280; text-transform: uppercase; letter-spacing: .5px; margin-top: 1px; }
  .resumo-card.green  { border-color: #bbf7d0; background: #f0fdf4; }
  .resumo-card.green .val  { color: #166534; }
  .resumo-card.yellow { border-color: #fde68a; background: #fefce8; }
  .resumo-card.yellow .val { color: #92400e; }
  .resumo-card.red    { border-color: #fca5a5; background: #fef2f2; }
  .resumo-card.red .val    { color: #991b1b; }
</style>
</head><body>
<div class="header">
  <div class="header-left">
    <h1>${_empNome}</h1>
    <p>${condsDesc}${p && (p.entrada_pct || p.entrada_valor) ? ' · Entrada: ' + entradaSubHd : ''}</p>
  </div>
  <div class="header-right">
    <div class="data">${titulo}</div>
    <div class="titulo">${now}</div>
  </div>
</div>
<table>
  <thead><tr>
    ${isLoteamento ? `
      <th>Quadra</th><th>Lote</th>
      <th class="right">Área</th>
      <th class="right">Valor</th>
      ${entHdCell}
      ${refColHd}
      ${condCols}
      <th class="center">Status</th>
    ` : `
      <th>Andar</th><th>Unidade</th><th>Tipologia</th>
      <th class="right">Área</th>
      <th class="right">Valor</th>
      ${entHdCell}
      ${refColHd}
      ${condCols}
      <th class="center">Status</th>
    `}
  </tr></thead>
  <tbody>${rows}</tbody>
</table>
<div class="resumo">
  <div class="resumo-card"><div class="val">${total}</div><div class="lbl">Total</div></div>
  <div class="resumo-card green"><div class="val">${nDisp}</div><div class="lbl">Disponível</div></div>
  <div class="resumo-card yellow"><div class="val">${nRes}</div><div class="lbl">Reservado</div></div>
  <div class="resumo-card red"><div class="val">${nVend}</div><div class="lbl">Vendido</div></div>
  ${nIndisp > 0 ? `<div class="resumo-card"><div class="val">${nIndisp}</div><div class="lbl">Indisponível</div></div>` : ''}
</div>
${obsLines.length ? `<div style="margin-top:${isLoteamento?'3px':'8px'};font-size:${isLoteamento?'7px':'9px'};color:#6b7280">${obsLines.map(l=>`• ${l}`).join('<br>')}</div>` : ''}
${'<sc'+'ript>window.onload=()=>window.print()<'+'/sc'+'ript>'}
</body></html>`;

  const w = window.open('', '_blank');
  if (!w) return alert('Permita popups para exportar a tabela.');
  w.document.write(html);
  w.document.close();
}

function iniciarContador() {
  clearInterval(timer);
  countdown = 15;
  document.getElementById('countdown').textContent = countdown;
  timer = setInterval(() => {
    countdown--;
    document.getElementById('countdown').textContent = countdown;
    if (countdown <= 0) { clearInterval(timer); carregar().then(iniciarContador); }
  }, 1000);
}

if (!slug) {
  document.getElementById('conteudo').innerHTML = '<div class="erro">⚠️ Link inválido. Verifique a URL do espelho de vendas.</div>';
} else {
  carregar().then(iniciarContador);
  window.addEventListener('resize', ajustarMarcadores);
}
</script>
</body>
</html>
