<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espelho de Vendas</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }

  header { background: #1e293b; border-bottom: 1px solid #334155; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .logo { font-size: 20px; font-weight: 800; color: #fff; }
  .logo span { color: #14b8a6; }
  .subtitle { font-size: 13px; color: #94a3b8; margin-top: 2px; }
  .atualizado { font-size: 12px; color: #64748b; text-align: right; }
  .atualizado strong { color: #94a3b8; }

  .resumo { display: flex; gap: 12px; padding: 16px 24px; flex-wrap: wrap; }
  .resumo-card { flex: 1; min-width: 120px; background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 14px 18px; text-align: center; }
  .resumo-card .num { font-size: 28px; font-weight: 800; line-height: 1; }
  .resumo-card .label { font-size: 12px; color: #94a3b8; margin-top: 4px; text-transform: uppercase; letter-spacing: .05em; }
  .resumo-card.disp .num  { color: #22c55e; }
  .resumo-card.res  .num  { color: #f59e0b; }
  .resumo-card.vend .num  { color: #ef4444; }
  .resumo-card.total .num { color: #e2e8f0; }
  .resumo-card.indisp .num { color: #94a3b8; }
  .maps-btn { display:flex; align-items:center; gap:7px; background:#1a73e8; color:#fff; border-radius:10px; padding:14px 20px; font-size:13px; font-weight:700; text-decoration:none; white-space:nowrap; transition:background .15s; border:1px solid #1557b0; }
  .maps-btn:hover { background:#1557b0; }
  .maps-btn svg { flex-shrink:0; }
  .drive-btn { display:flex; align-items:center; gap:7px; background:#1fa463; color:#fff; border-radius:10px; padding:14px 20px; font-size:13px; font-weight:700; text-decoration:none; white-space:nowrap; transition:background .15s; border:1px solid #178a52; }
  .drive-btn:hover { background:#178a52; }
  .drive-btn svg { flex-shrink:0; }
  .social-btn { display:flex; align-items:center; gap:7px; background:#c13584; color:#fff; border-radius:10px; padding:14px 20px; font-size:13px; font-weight:700; text-decoration:none; white-space:nowrap; transition:background .15s; border:1px solid #9c2a6a; }
  .social-btn:hover { background:#9c2a6a; }
  .social-btn svg { flex-shrink:0; }

  main { padding: 0 24px 32px; }

  /* Mapa com overlay */
  .mapa-outer { overflow: hidden; width: 100%; border-radius: 12px; touch-action: none; }
  .mapa-wrap { position: relative; display: block; width: 100%; transform-origin: 0 0; will-change: transform; }
  .mapa-wrap img { width: 100%; display: block; border-radius: 12px; user-select: none; -webkit-user-drag: none; }
  .marcador {
    position: absolute; transform: translate(-50%, -50%);
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid rgba(0,0,0,.35); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 7px; font-weight: 700; color: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.5); transition: transform .15s;
  }
  .marcador:hover { transform: translate(-50%,-50%) scale(1.4); z-index: 10; }
  .marcador.disponivel  { background: #22c55e; }
  .marcador.reservado   { background: #f59e0b; }
  .marcador.vendido     { background: #ef4444; }
  .marcador.entregue    { background: #ef4444; }
  .marcador.indisponivel { background: #64748b; }
  .marcador .tip {
    display: none; position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    background: #0f172a; border: 1px solid #334155; border-radius: 6px;
    padding: 6px 10px; white-space: nowrap; font-size: 11px; z-index: 20;
    pointer-events: none; line-height: 1.5;
  }
  .marcador:hover .tip { display: block; }

  /* Grade de tiles */
  .grade-section { margin-top: 0; }
  .grade-titulo { font-size: 14px; font-weight: 600; color: #94a3b8; margin-bottom: 12px; }
  .grade { display: flex; flex-wrap: wrap; gap: 6px; }
  .tile {
    width: 54px; height: 54px; border-radius: 8px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; cursor: pointer;
    border: 1.5px solid transparent; font-weight: 700;
    transition: transform .15s; position: relative;
  }
  .tile:hover { transform: scale(1.15); z-index: 5; }
  .tile .lote-num { font-size: 14px; line-height: 1; }
  .tile .quadra   { font-size: 9px; opacity: .7; margin-top: 1px; }
  .tile.disponivel  { background: #14532d; border-color: #22c55e; color: #4ade80; }
  .tile.reservado   { background: #78350f; border-color: #f59e0b; color: #fbbf24; }
  .tile.vendido     { background: #7f1d1d; border-color: #ef4444; color: #fca5a5; }
  .tile.entregue    { background: #7f1d1d; border-color: #ef4444; color: #fca5a5; }
  .tile.indisponivel { background: #1e293b; border-color: #64748b; color: #94a3b8; }
  .tile .tip2 {
    display: none; position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    background: #1e293b; border: 1px solid #334155; border-radius: 6px;
    padding: 6px 10px; white-space: nowrap; font-size: 11px; z-index: 20;
    pointer-events: none; line-height: 1.5; color: #e2e8f0;
  }
  .tile:hover .tip2 { display: block; }

  /* Legenda */
  .legenda { display: flex; gap: 16px; flex-wrap: wrap; margin: 16px 0 20px; align-items: center; }
  .leg-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #94a3b8; }
  .leg-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .leg-dot.disponivel   { background: #22c55e; }
  .leg-dot.reservado    { background: #f59e0b; }
  .leg-dot.vendido      { background: #ef4444; }
  .leg-dot.entregue     { background: #8b5cf6; }
  .leg-dot.indisponivel { background: #64748b; }
  .leg-sim-hint { margin-left: auto; font-size: 11px; color: #475569; display: flex; align-items: center; gap: 5px; }

  /* Modal de simulação */
  .sim-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 200;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .sim-modal {
    background: #1e293b; border: 1px solid #334155; border-radius: 14px;
    max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto;
    box-shadow: 0 24px 48px rgba(0,0,0,.6);
  }
  .sim-head {
    padding: 18px 20px 14px; border-bottom: 1px solid #334155;
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .sim-head-left .sim-title { font-size: 17px; font-weight: 800; color: #f1f5f9; }
  .sim-head-left .sim-sub   { font-size: 12px; color: #64748b; margin-top: 2px; }
  .sim-close {
    background: none; border: none; color: #64748b; font-size: 20px; cursor: pointer;
    padding: 0 4px; line-height: 1; flex-shrink: 0; margin-left: 12px;
  }
  .sim-close:hover { color: #e2e8f0; }
  .sim-body { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .sim-info-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  .sim-info-cell {
    background: #0f172a; border-radius: 8px; padding: 10px 12px;
  }
  .sim-info-cell .lbl { font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 3px; }
  .sim-info-cell .val { font-size: 15px; font-weight: 700; color: #e2e8f0; }
  .sim-info-cell .val.price { color: #14b8a6; font-size: 17px; }
  .sim-section-title {
    font-size: 11px; color: #64748b; text-transform: uppercase;
    letter-spacing: .07em; margin-bottom: 8px; font-weight: 600;
  }
  .sim-entrada-box {
    background: #0f172a; border-radius: 8px; padding: 12px 14px;
  }
  .sim-entrada-row { display: flex; justify-content: space-between; align-items: baseline; }
  .sim-entrada-total { font-size: 16px; font-weight: 800; color: #fbbf24; }
  .sim-entrada-detalhe { font-size: 12px; color: #94a3b8; margin-top: 4px; }
  .sim-cond-card {
    background: #0f172a; border-radius: 8px; padding: 12px 14px;
    border-left: 3px solid #334155;
  }
  .sim-cond-card.first { border-left-color: #14b8a6; }
  .sim-cond-label { font-size: 13px; font-weight: 700; color: #e2e8f0; margin-bottom: 6px; }
  .sim-cond-rows { display: flex; flex-direction: column; gap: 3px; }
  .sim-cond-row  { display: flex; justify-content: space-between; font-size: 12px; }
  .sim-cond-key  { color: #94a3b8; }
  .sim-cond-val  { color: #e2e8f0; font-weight: 600; }
  .sim-cond-total-row { display: flex; justify-content: space-between; font-size: 13px; margin-top: 8px; padding-top: 8px; border-top: 1px solid #1e293b; }
  .sim-cond-total-lbl { color: #64748b; font-weight: 600; }
  .sim-cond-total-val { color: #e2e8f0; font-weight: 800; }
  .sim-no-params { background: #0f172a; border-radius: 8px; padding: 14px; font-size: 13px; color: #64748b; text-align: center; }
  .sim-foot {
    padding: 14px 20px; border-top: 1px solid #334155;
    display: flex; gap: 10px; justify-content: flex-end;
  }
  .btn-sim { padding: 9px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; }
  .btn-sim.secondary { background: #334155; color: #e2e8f0; }
  .btn-sim.secondary:hover { background: #475569; }
  .btn-sim.primary { background: #0d9488; color: #fff; }
  .btn-sim.primary:hover { background: #0f766e; }
  .sim-aviso { font-size: 10px; color: #475569; text-align: center; padding: 0 20px 14px; }
  /* Botão WhatsApp */
  .btn-sim.wa { background: #25d366; color: #fff; }
  .btn-sim.wa:hover { background: #1ebe5e; }
  /* Campos do formulário de proposta */
  .sim-field { display: flex; flex-direction: column; gap: 5px; }
  .sim-field label { font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
  .sim-field input, .sim-field textarea { background: #0f172a; border: 1px solid #334155; border-radius: 7px; color: #e2e8f0; font-size: 13px; padding: 8px 12px; width: 100%; font-family: inherit; }
  .sim-field input:focus, .sim-field textarea:focus { outline: none; border-color: #14b8a6; }
  .sim-field textarea { resize: vertical; min-height: 80px; }

  /* Contador regressivo */
  .refresh-bar { text-align: center; font-size: 11px; color: #475569; padding: 8px 0 4px; }
  .refresh-bar span { color: #14b8a6; font-weight: 600; }

  .loading { text-align: center; padding: 80px 24px; color: #64748b; }
  .erro    { text-align: center; padding: 60px 24px; color: #ef4444; }

  @media (max-width: 600px) {
    header { padding: 12px 16px; }
    .resumo { padding: 12px 16px; gap: 8px; }
    main { padding: 0 16px 24px; }
    .tile { width: 46px; height: 46px; }
    .tile .lote-num { font-size: 12px; }
    .sim-info-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">R2X <span>CRM</span></div>
    <div class="subtitle" id="emp-nome">Carregando...</div>
  </div>
  <div class="atualizado">
    Espelho de Vendas — Tempo Real<br>
    <strong id="hora-atual">—</strong>
  </div>
</header>

<div class="resumo" id="resumo">
  <div class="resumo-card total"><div class="num" id="r-total">—</div><div class="label">Total</div></div>
  <div class="resumo-card disp"><div class="num" id="r-disp">—</div><div class="label">Disponível</div></div>
  <div class="resumo-card res"><div class="num" id="r-res">—</div><div class="label">Reservado</div></div>
  <div class="resumo-card vend"><div class="num" id="r-vend">—</div><div class="label">Vendido</div></div>
  <div class="resumo-card indisp" id="r-indisp-card" style="display:none"><div class="num" id="r-indisp">0</div><div class="label">Indisponível</div></div>
  <a id="maps-btn" href="#" target="_blank" rel="noopener" class="maps-btn" style="display:none">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
    Ver no Maps
  </a>
  <a id="drive-btn" href="#" target="_blank" rel="noopener" class="drive-btn" style="display:none">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19H2l5-9h10l5 9z"/><path d="M7.5 14L12 6l4.5 8"/><path d="M2 19l5-9"/></svg>
    Material de divulgação
  </a>
  <a id="social-btn" href="#" target="_blank" rel="noopener" class="social-btn" style="display:none">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
    Redes Sociais
  </a>
</div>

<main>
  <div id="conteudo"><div class="loading">Carregando espelho de vendas...</div></div>
  <div class="refresh-bar">Atualiza automaticamente em <span id="countdown">15</span>s</div>
</main>

<script>
const slug = location.pathname.split('/espelho/')[1]?.split('/')[0];
let countdown = 15, timer;
let _empNome = '';
let _simParams = null;
let _markerSize = 20;
let _mapsUrl = null;
let _driveUrl = null;
let _socialUrl = null;

const fmt  = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', minimumFractionDigits: 2 });
const fmt0 = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });

function statusLabel(s) {
  return { disponivel: 'Disponível', reservado: 'Reservado', vendido: 'Vendido', entregue: 'Vendido', indisponivel: 'Indisponível' }[s] || s;
}

// ── Cálculo PMT (Price) ──────────────────────────────────────────────────────
function calcPMT(saldo, nParc, juros) {
  if (saldo <= 0 || nParc <= 0) return 0;
  if (!juros) return saldo / nParc;
  const i = juros / 100;
  return saldo * (i * Math.pow(1+i, nParc)) / (Math.pow(1+i, nParc) - 1);
}

// ── Simulação ────────────────────────────────────────────────────────────────
function abrirSimulacao(unitId) {
  const u = (window._units || []).find(x => x.id === unitId);
  if (!u) return;

  const p = _simParams;
  const preco = u.preco;

  // Calcula entrada e condições
  let entV = 0, entLabel = '', entDetalhe = '';
  let condsHtml = '';

  if (p && preco) {
    const entFixo = p.entrada_tipo === 'valor';
    entV = entFixo ? (p.entrada_valor || 0) : preco * ((p.entrada_pct || 0) / 100);
    const entParcN = p.entrada_parc || 1;
    const pctFmt = entFixo ? fmt0.format(entV) : ((p.entrada_pct||0).toFixed(0) + '% — ' + fmt0.format(entV));
    entLabel = fmt.format(entV);
    entDetalhe = entParcN > 1
      ? `${entParcN}× de ${fmt.format(entV / entParcN)}`
      : 'à vista';

    const totalRef = preco * ((p.pRef || 0) / 100);
    const saldo = preco - entV - totalRef;
    const condicoes = p.condicoes || [];

    condsHtml = condicoes.map((c, i) => {
      const pmv = calcPMT(saldo, c.nParc, c.juros || 0);
      const totalCond = entV + totalRef + c.nParc * pmv;
      const semJuros = !c.juros;
      const chk = semJuros && Math.abs(totalCond - preco) < 1 ? ' ✓' : '';
      const balaoInfo = totalRef > 0 ? `<div class="sim-cond-row"><span class="sim-cond-key">Balões</span><span class="sim-cond-val">${fmt0.format(totalRef)}</span></div>` : '';
      return `<div class="sim-cond-card${i === 0 ? ' first' : ''}">
        <div class="sim-cond-label">${c.label || c.nParc + 'x'} ${c.juros > 0 ? '· ' + c.juros.toFixed(2) + '% a.m.' : '· sem juros'}</div>
        <div class="sim-cond-rows">
          ${balaoInfo}
          <div class="sim-cond-row">
            <span class="sim-cond-key">${c.nParc}× parcelas</span>
            <span class="sim-cond-val">${fmt.format(pmv)}/mês</span>
          </div>
        </div>
        <div class="sim-cond-total-row">
          <span class="sim-cond-total-lbl">Total${chk}</span>
          <span class="sim-cond-total-val">${fmt0.format(totalCond)}</span>
        </div>
      </div>`;
    }).join('');
  }

  const dispVendido = u.status === 'vendido' || u.status === 'reservado';
  const statusBadge = dispVendido
    ? `<span style="background:${u.status==='vendido'?'#7f1d1d':'#78350f'};color:${u.status==='vendido'?'#fca5a5':'#fbbf24'};padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700">${statusLabel(u.status).toUpperCase()}</span>`
    : '';

  const semParamsHtml = !p || !preco ? `<div class="sim-no-params">
    ${!preco ? 'Este lote não possui valor cadastrado.' : 'Condições de pagamento ainda não configuradas pelo empreendedor.'}
  </div>` : '';

  // Build footer + optional form screen (screen-2)
  const propostaBtn = (p && preco && u.status === 'disponivel')
    ? '<button class="btn-sim wa" onclick="mostrarFormProposta(' + unitId + ')">📲 Proposta</button>'
    : '';
  const formFields = [
    '<div class="sim-field"><label>Nome do Cliente *</label><input id="sf-cliente" type="text" placeholder="Ex: João da Silva" autocomplete="off"></div>',
    '<div class="sim-field"><label>CPF do Cliente</label><input id="sf-cpf" type="text" placeholder="000.000.000-00" oninput="fmtCPF(this)" maxlength="14" autocomplete="off"></div>',
    '<div class="sim-field"><label>Nome do Corretor *</label><input id="sf-corretor" type="text" placeholder="Seu nome" autocomplete="off"></div>',
    '<div class="sim-field"><label>Proposta</label><textarea id="sf-proposta" rows="5"></textarea></div>',
    '<div class="sim-field"><label>Observações</label><textarea id="sf-obs" rows="2" placeholder="Observações adicionais..."></textarea></div>'
  ].join('');
  const footerContent = p && preco
    ? `<div class="sim-foot">
        <button class="btn-sim secondary" onclick="fecharSimulacao()">Fechar</button>
        <button class="btn-sim primary" onclick="gerarPDFSimulacao(${unitId})">🖨️ PDF</button>
        ${propostaBtn}
      </div>
      <div class="sim-aviso">* Simulação sujeita a alterações. Consulte a equipe da R2X.</div>
      </div>
      <div id="sim-screen-2" style="display:none">
        <div class="sim-body" style="border-top:1px solid #334155">
          <div style="font-size:12px;color:#64748b;padding:0 0 8px">Preencha para enviar a proposta via WhatsApp:</div>
          ${formFields}
        </div>
        <div class="sim-foot">
          <button class="btn-sim secondary" onclick="voltarParaSimulacao()">← Voltar</button>
          <button class="btn-sim wa" onclick="enviarPropostaWA(${unitId})">📲 Enviar WhatsApp</button>
        </div>
      </div>`
    : '<div class="sim-foot"><button class="btn-sim secondary" onclick="fecharSimulacao()">Fechar</button></div></div>';

  const modalHtml = `<div class="sim-overlay" id="sim-overlay" onclick="if(event.target===this)fecharSimulacao()">
    <div class="sim-modal">
      <div class="sim-head">
        <div class="sim-head-left">
          <div class="sim-title">Lote ${u.lote}${u.quadra ? ' · Quadra ' + u.quadra : ''} ${statusBadge}</div>
          <div class="sim-sub">${_empNome}</div>
        </div>
        <button class="sim-close" onclick="fecharSimulacao()">✕</button>
      </div>
      <div id="sim-screen-1">
      <div class="sim-body">
        <div class="sim-info-grid">
          ${u.area_m2 ? `<div class="sim-info-cell"><div class="lbl">Área</div><div class="val">${Number(u.area_m2).toLocaleString('pt-BR', {minimumFractionDigits:2})} m²</div></div>` : ''}
          ${preco ? `<div class="sim-info-cell"><div class="lbl">Valor</div><div class="val price">${fmt0.format(preco)}</div></div>` : ''}
        </div>

        ${p && preco && entV > 0 ? `
        <div>
          <div class="sim-section-title">Entrada</div>
          <div class="sim-entrada-box">
            <div class="sim-entrada-row">
              <span style="font-size:13px;color:#94a3b8">Valor da entrada</span>
              <span class="sim-entrada-total">${entLabel}</span>
            </div>
            <div class="sim-entrada-detalhe">${entDetalhe}</div>
          </div>
        </div>` : ''}

        ${condsHtml ? `<div><div class="sim-section-title">Condições de Parcelamento</div><div style="display:flex;flex-direction:column;gap:8px">${condsHtml}</div></div>` : semParamsHtml}
      </div>
      ${footerContent}
    </div>
  </div>`;

  document.body.insertAdjacentHTML('beforeend', modalHtml);
}

function fecharSimulacao() {
  document.getElementById('sim-overlay')?.remove();
}

function mostrarFormProposta(unitId) {
  const u = (window._units || []).find(x => x.id === unitId);
  if (!u) return;
  const p = _simParams;
  const preco = u.preco;

  // Pré-preenche o textarea de proposta
  let txt = `Empreendimento: ${_empNome}\n`;
  txt += `Lote: ${u.lote}${u.quadra ? ' · Quadra ' + u.quadra : ''}`;
  if (u.area_m2) txt += ` · ${Number(u.area_m2).toLocaleString('pt-BR', {minimumFractionDigits:2})}m²`;
  txt += `\nValor: ${fmt0.format(preco)}\n`;
  if (p && preco) {
    const entFixo = p.entrada_tipo === 'valor';
    const entV    = entFixo ? (p.entrada_valor || 0) : preco * ((p.entrada_pct || 0) / 100);
    const entParcN = p.entrada_parc || 1;
    txt += `Entrada: ${fmt.format(entV)}`;
    txt += entParcN > 1 ? ` (${entParcN}x de ${fmt.format(entV / entParcN)})` : ' (à vista)';
    txt += '\n';
    const totalRef = preco * ((p.pRef || 0) / 100);
    const saldo    = preco - entV - totalRef;
    (p.condicoes || []).forEach(c => {
      const pmv = calcPMT(saldo, c.nParc, c.juros || 0);
      txt += `${c.label || c.nParc + 'x'}: ${c.nParc}x ${fmt.format(pmv)}/mês`;
      if (c.juros > 0) txt += ` (${c.juros.toFixed(2)}% a.m.)`;
      txt += '\n';
    });
  }

  document.getElementById('sim-screen-1').style.display = 'none';
  document.getElementById('sim-screen-2').style.display = '';
  const el = document.getElementById('sf-proposta');
  if (el && !el.value) el.value = txt.trim();
  document.getElementById('sf-cliente')?.focus();
}

function voltarParaSimulacao() {
  document.getElementById('sim-screen-2').style.display = 'none';
  document.getElementById('sim-screen-1').style.display = '';
}

function fmtCPF(input) {
  let v = input.value.replace(/\D/g, '').slice(0, 11);
  if (v.length > 9)      v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{0,2})/, '$1.$2.$3-$4');
  else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{0,3})/, '$1.$2.$3');
  else if (v.length > 3) v = v.replace(/(\d{3})(\d{0,3})/, '$1.$2');
  input.value = v;
}

// ── Carregamento principal ───────────────────────────────────────────────────
async function carregar() {
  try {
    const r    = await fetch(`/api/espelho-publico/${slug}`);
    const resp = await r.json();
    if (!resp.ok) {
      document.getElementById('conteudo').innerHTML = `<div class="erro">⚠️ ${resp.error}</div>`;
      return;
    }

    const { empreendimento: emp, imagem, units, resumo, espelhoParams, markerSize, mapsUrl, driveUrl, socialUrl, atualizado_em } = resp.data;
    _empNome    = emp.nome + (emp.cidade ? ` — ${emp.cidade}/${emp.estado}` : '');
    _simParams  = espelhoParams || null;
    _markerSize = markerSize || 20;
    _mapsUrl    = mapsUrl || null;
    _driveUrl   = driveUrl || null;
    _socialUrl  = socialUrl || null;
    const mapsBtn = document.getElementById('maps-btn');
    if (mapsBtn) { mapsBtn.href = _mapsUrl || '#'; mapsBtn.style.display = _mapsUrl ? '' : 'none'; }
    const driveBtn = document.getElementById('drive-btn');
    if (driveBtn) { driveBtn.href = _driveUrl || '#'; driveBtn.style.display = _driveUrl ? '' : 'none'; }
    const socialBtn = document.getElementById('social-btn');
    if (socialBtn) { socialBtn.href = _socialUrl || '#'; socialBtn.style.display = _socialUrl ? '' : 'none'; }

    document.title = `Espelho — ${emp.nome}`;
    document.getElementById('emp-nome').textContent  = _empNome;
    document.getElementById('hora-atual').textContent = new Date(atualizado_em).toLocaleTimeString('pt-BR');

    document.getElementById('r-total').textContent = units.length;
    document.getElementById('r-disp').textContent  = resumo.disponivel || 0;
    document.getElementById('r-res').textContent   = resumo.reservado  || 0;
    document.getElementById('r-vend').textContent  = resumo.vendido    || 0;
    const indispCard = document.getElementById('r-indisp-card');
    if (resumo.indisponivel) {
      document.getElementById('r-indisp').textContent = resumo.indisponivel;
      if (indispCard) indispCard.style.display = '';
    } else {
      if (indispCard) indispCard.style.display = 'none';
    }

    const sortNum = (a, b) => {
      const qa = String(a.quadra||''), qb = String(b.quadra||'');
      const qna = parseFloat(qa), qnb = parseFloat(qb);
      const qcmp = (!isNaN(qna) && !isNaN(qnb)) ? qna - qnb : qa.localeCompare(qb, 'pt-BR', {numeric:true});
      if (qcmp !== 0) return qcmp;
      const la = parseFloat(String(a.lote||'').replace(/\D.*$/,'')) || 0;
      const lb = parseFloat(String(b.lote||'').replace(/\D.*$/,'')) || 0;
      return la !== lb ? la - lb : String(a.lote||'').localeCompare(String(b.lote||''), 'pt-BR', {numeric:true});
    };
    units.sort(sortNum);
    window._units = units;
    const comPosicao = units.filter(u => u.mapa_x != null && u.mapa_y != null);
    const html = [];

    const simHint = _simParams
      ? `<span class="leg-sim-hint">💡 Clique em um lote para simular</span>`
      : '';

    html.push(`<div class="legenda">
      <div class="leg-item"><div class="leg-dot disponivel"></div>Disponível</div>
      <div class="leg-item"><div class="leg-dot reservado"></div>Reservado</div>
      <div class="leg-item"><div class="leg-dot vendido"></div>Vendido</div>
      ${resumo.indisponivel ? `<div class="leg-item"><div class="leg-dot indisponivel"></div>Indisponível</div>` : ''}
      ${simHint}
    </div>`);

    if (imagem && comPosicao.length > 0) {
      html.push(`<div class="mapa-outer" id="mapa-outer">
        <div class="mapa-wrap" id="mapa-wrap">
          <img src="${imagem}" id="mapa-img" alt="Mapa" onload="ajustarMarcadores()">
          <div id="marcadores"></div>
        </div>
      </div>`);
      document.getElementById('conteudo').innerHTML = html.join('');
      window._comPosicao = comPosicao;
      ajustarMarcadores();
      initMapaPinchZoom();
    } else {
      if (imagem) {
        html.push(`<div style="margin-bottom:20px"><img src="${imagem}" style="width:100%;max-width:1100px;border-radius:12px;display:block" alt="Mapa"></div>`);
      }
      const quadras = {};
      for (const u of units) {
        const q = u.quadra || '—';
        if (!quadras[q]) quadras[q] = [];
        quadras[q].push(u);
      }
      html.push(`<div class="grade-section">`);
      for (const [q, lotes] of Object.entries(quadras)) {
        if (Object.keys(quadras).length > 1) {
          html.push(`<div class="grade-titulo">${q !== '—' ? 'Quadra ' + q : 'Lotes'}</div>`);
        }
        html.push(`<div class="grade" style="margin-bottom:16px">`);
        for (const u of lotes) {
          const tipInfo = [
            u.quadra ? `Quadra ${u.quadra}` : '',
            `Lote ${u.lote}`,
            u.area_m2 ? `${u.area_m2}m²` : '',
            u.preco ? fmt0.format(u.preco) : '',
            statusLabel(u.status)
          ].filter(Boolean).join('<br>');
          html.push(`<div class="tile ${u.status}" onclick="abrirSimulacao(${u.id})" title="Clique para simular">
            <div class="lote-num">${u.lote}</div>
            ${u.quadra ? `<div class="quadra">Q${u.quadra}</div>` : ''}
            <div class="tip2">${tipInfo}</div>
          </div>`);
        }
        html.push(`</div>`);
      }
      html.push(`</div>`);
      document.getElementById('conteudo').innerHTML = html.join('');
    }

  } catch(e) {
    document.getElementById('conteudo').innerHTML = `<div class="erro">⚠️ Erro ao carregar: ${e.message}</div>`;
  }
}

function ajustarMarcadores() {
  const wrap = document.getElementById('mapa-wrap');
  const img  = document.getElementById('mapa-img');
  const cont = document.getElementById('marcadores');
  if (!wrap || !img || !cont || !window._units) return;

  const w = img.offsetWidth || img.naturalWidth;
  const h = img.offsetHeight || img.naturalHeight;
  if (!w || !h) return;

  const sz = Math.round(Math.max(6, Math.min(120, _markerSize)));
  const fs = Math.round(Math.max(4, Math.min(28,  _markerSize * 0.42)));

  const html = [];
  for (const u of (window._comPosicao || [])) {
    const x = (u.mapa_x / 100) * w;
    const y = (u.mapa_y / 100) * h;
    const tipInfo = [
      u.quadra ? `Quadra ${u.quadra}` : '',
      `Lote ${u.lote}`,
      u.area_m2 ? `${u.area_m2}m²` : '',
      u.preco ? fmt0.format(u.preco) : '',
      statusLabel(u.status)
    ].filter(Boolean).join('<br>');
    html.push(`<div class="marcador ${u.status}" style="left:${x}px;top:${y}px;width:${sz}px;height:${sz}px;font-size:${fs}px" onclick="abrirSimulacao(${u.id})">
      ${/^\d+$/.test(u.lote) ? String(parseInt(u.lote, 10)) : u.lote}
      <div class="tip">${tipInfo}</div>
    </div>`);
  }
  cont.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none';
  cont.innerHTML = html.join('');
  cont.querySelectorAll('.marcador').forEach(m => m.style.pointerEvents = 'auto');
}

let _mapaScale = 1, _mapaTX = 0, _mapaTY = 0;

function initMapaPinchZoom() {
  const outer = document.getElementById('mapa-outer');
  const wrap  = document.getElementById('mapa-wrap');
  if (!outer || !wrap) return;
  _mapaScale = 1; _mapaTX = 0; _mapaTY = 0;
  wrap.style.transform = '';

  let pinchDist0 = null, scale0 = 1, mid0 = null, tx0 = 0, ty0 = 0;
  let panStart = null, panTX0 = 0, panTY0 = 0;

  function getDist(t) {
    return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  }
  function getMid(t) {
    return { x: (t[0].clientX + t[1].clientX) / 2, y: (t[0].clientY + t[1].clientY) / 2 };
  }
  function clamp(tx, ty, s) {
    const iW = outer.offsetWidth, iH = outer.offsetHeight;
    return {
      tx: Math.min(0, Math.max(iW * (1 - s), tx)),
      ty: Math.min(0, Math.max(iH * (1 - s), ty))
    };
  }
  function applyTransform() {
    wrap.style.transform = `translate(${_mapaTX}px,${_mapaTY}px) scale(${_mapaScale})`;
  }

  outer.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      e.preventDefault();
      pinchDist0 = getDist(e.touches);
      scale0 = _mapaScale; mid0 = getMid(e.touches);
      tx0 = _mapaTX; ty0 = _mapaTY;
      panStart = null;
    } else if (e.touches.length === 1) {
      if (_mapaScale > 1) {
        panStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        panTX0 = _mapaTX; panTY0 = _mapaTY;
      }
      pinchDist0 = null;
    }
  }, { passive: false });

  outer.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && pinchDist0 !== null) {
      e.preventDefault();
      const newScale = Math.max(1, Math.min(6, scale0 * (getDist(e.touches) / pinchDist0)));
      const mid1 = getMid(e.touches);
      const rect  = outer.getBoundingClientRect();
      const focalLX = (mid0.x - rect.left - tx0) / scale0;
      const focalLY = (mid0.y - rect.top  - ty0) / scale0;
      const c = clamp(mid1.x - rect.left - newScale * focalLX,
                      mid1.y - rect.top  - newScale * focalLY, newScale);
      _mapaScale = newScale; _mapaTX = c.tx; _mapaTY = c.ty;
      applyTransform();
    } else if (e.touches.length === 1 && panStart && _mapaScale > 1) {
      e.preventDefault();
      const c = clamp(panTX0 + e.touches[0].clientX - panStart.x,
                      panTY0 + e.touches[0].clientY - panStart.y, _mapaScale);
      _mapaTX = c.tx; _mapaTY = c.ty;
      applyTransform();
    }
  }, { passive: false });

  outer.addEventListener('touchend', e => {
    if (e.touches.length < 2) {
      pinchDist0 = null;
      // transição de pinch → pan: registra o dedo restante como início do pan
      if (e.touches.length === 1 && _mapaScale > 1) {
        panStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        panTX0 = _mapaTX; panTY0 = _mapaTY;
      }
    }
    if (e.touches.length === 0) panStart = null;
    if (_mapaScale <= 1.05) {
      _mapaScale = 1; _mapaTX = 0; _mapaTY = 0;
      wrap.style.transform = '';
    }
  }, { passive: true });
}

function iniciarContador() {
  clearInterval(timer);
  countdown = 15;
  document.getElementById('countdown').textContent = countdown;
  timer = setInterval(() => {
    countdown--;
    document.getElementById('countdown').textContent = countdown;
    if (countdown <= 0) { clearInterval(timer); carregar().then(iniciarContador); }
  }, 1000);
}

if (!slug) {
  document.getElementById('conteudo').innerHTML = '<div class="erro">⚠️ Link inválido. Verifique a URL do espelho de vendas.</div>';
} else {
  carregar().then(iniciarContador);
  window.addEventListener('resize', ajustarMarcadores);
}
