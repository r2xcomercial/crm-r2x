<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espelho de Vendas</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }

  header { background: #1e293b; border-bottom: 1px solid #334155; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .logo { font-size: 20px; font-weight: 800; color: #fff; }
  .logo span { color: #14b8a6; }
  .subtitle { font-size: 13px; color: #94a3b8; margin-top: 2px; }
  .atualizado { font-size: 12px; color: #64748b; text-align: right; }
  .atualizado strong { color: #94a3b8; }

  .resumo { display: flex; gap: 12px; padding: 16px 24px; flex-wrap: wrap; }
  .resumo-card { flex: 1; min-width: 120px; background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 14px 18px; text-align: center; }
  .resumo-card .num { font-size: 28px; font-weight: 800; line-height: 1; }
  .resumo-card .label { font-size: 12px; color: #94a3b8; margin-top: 4px; text-transform: uppercase; letter-spacing: .05em; }
  .resumo-card.disp .num  { color: #22c55e; }
  .resumo-card.res  .num  { color: #f59e0b; }
  .resumo-card.vend .num  { color: #ef4444; }
  .resumo-card.total .num { color: #e2e8f0; }
  .resumo-card.indisp .num { color: #94a3b8; }
  .maps-btn { display:flex; align-items:center; gap:7px; background:#1a73e8; color:#fff; border-radius:10px; padding:14px 20px; font-size:13px; font-weight:700; text-decoration:none; white-space:nowrap; transition:background .15s; border:1px solid #1557b0; }
  .maps-btn:hover { background:#1557b0; }
  .maps-btn svg { flex-shrink:0; }
  .drive-btn { display:flex; align-items:center; gap:7px; background:#1fa463; color:#fff; border-radius:10px; padding:14px 20px; font-size:13px; font-weight:700; text-decoration:none; white-space:nowrap; transition:background .15s; border:1px solid #178a52; }
  .drive-btn:hover { background:#178a52; }
  .drive-btn svg { flex-shrink:0; }
  .social-btn { display:flex; align-items:center; gap:7px; background:#c13584; color:#fff; border-radius:10px; padding:14px 20px; font-size:13px; font-weight:700; text-decoration:none; white-space:nowrap; transition:background .15s; border:1px solid #9c2a6a; }
  .social-btn:hover { background:#9c2a6a; }
  .social-btn svg { flex-shrink:0; }
  .export-btn { display:none; align-items:center; gap:7px; background:#475569; color:#fff; border-radius:10px; padding:14px 20px; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap; transition:background .15s; border:1px solid #334155; }
  .export-btn:hover { background:#334155; }
  .export-btn svg { flex-shrink:0; }

  /* Login corretor */
  .corretor-btn { display:flex; align-items:center; gap:6px; background:transparent; color:#94a3b8; border:1px solid #334155; border-radius:10px; padding:10px 16px; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; transition:all .15s; }
  .corretor-btn:hover { border-color:#64748b; color:#e2e8f0; }
  .corretor-logado { display:flex; align-items:center; gap:8px; font-size:12px; color:#4ade80; font-weight:600; white-space:nowrap; }
  .corretor-logado button { background:transparent; border:1px solid #334155; border-radius:6px; color:#94a3b8; font-size:11px; padding:4px 8px; cursor:pointer; }

  /* Modal genérico */
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:200; align-items:center; justify-content:center; padding:16px; }
  .modal-overlay.open { display:flex; }
  .modal-box { background:#1e293b; border:1px solid #334155; border-radius:14px; padding:24px; width:100%; max-width:400px; }
  .modal-box h3 { font-size:16px; font-weight:700; margin-bottom:16px; }
  .modal-box label { display:block; font-size:12px; color:#94a3b8; margin-bottom:4px; margin-top:12px; }
  .modal-box input, .modal-box textarea { width:100%; background:#0f172a; border:1px solid #334155; border-radius:8px; color:#e2e8f0; font-size:13px; padding:9px 12px; outline:none; font-family:inherit; }
  .modal-box input:focus, .modal-box textarea:focus { border-color:#14b8a6; }
  .modal-box textarea { resize:vertical; min-height:70px; }
  .modal-btns { display:flex; gap:8px; margin-top:16px; }
  .modal-btns button { flex:1; padding:10px; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer; border:none; }
  .btn-cancel { background:#334155; color:#94a3b8; }
  .btn-confirm { background:#14b8a6; color:#fff; }
  .btn-confirm:hover { background:#0d9488; }
  .modal-err { color:#f87171; font-size:12px; margin-top:8px; display:none; }
  .modal-ok  { color:#4ade80; font-size:12px; margin-top:8px; display:none; }

  main { padding: 0 24px 32px; }

  /* Mapa com overlay */
  .mapa-outer { overflow: hidden; width: 100%; border-radius: 12px; touch-action: none; }
  .mapa-wrap { position: relative; display: block; width: 100%; transform-origin: 0 0; will-change: transform; }
  .mapa-wrap img { width: 100%; display: block; border-radius: 12px; user-select: none; -webkit-user-drag: none; }
  .marcador {
    position: absolute; transform: translate(-50%, -50%);
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid rgba(0,0,0,.35); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 7px; font-weight: 700; color: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.5); transition: transform .15s;
  }
  .marcador:hover { transform: translate(-50%,-50%) scale(1.4); z-index: 10; }
  .marcador.disponivel  { background: #22c55e; }
  .marcador.reservado   { background: #f59e0b; }
  .marcador.vendido     { background: #ef4444; }
  .marcador.entregue    { background: #ef4444; }
  .marcador.indisponivel { background: #64748b; }
  .marcador .tip {
    display: none; position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    background: #0f172a; border: 1px solid #334155; border-radius: 6px;
    padding: 6px 10px; white-space: nowrap; font-size: 11px; z-index: 20;
    pointer-events: none; line-height: 1.5;
  }
  .marcador:hover .tip { display: block; }

  /* Grade de tiles */
  .grade-section { margin-top: 0; }
  .grade-titulo { font-size: 14px; font-weight: 600; color: #94a3b8; margin-bottom: 12px; }
  .grade {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
    gap: 8px;
  }
  .tile {
    aspect-ratio: 1; min-height: 62px;
    border-radius: 10px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; cursor: pointer;
    border: 1.5px solid transparent; font-weight: 700;
    transition: transform .15s; position: relative;
  }
  .tile:hover { transform: scale(1.1); z-index: 5; }
  .tile .lote-num { font-size: 15px; line-height: 1; }
  .tile .quadra   { font-size: 10px; opacity: .7; margin-top: 2px; }
  .tile.disponivel  { background: #14532d; border-color: #22c55e; color: #4ade80; }
  .tile.reservado   { background: #78350f; border-color: #f59e0b; color: #fbbf24; }
  .tile.vendido     { background: #7f1d1d; border-color: #ef4444; color: #fca5a5; }
  .tile.entregue    { background: #7f1d1d; border-color: #ef4444; color: #fca5a5; }
  .tile.indisponivel { background: #1e293b; border-color: #64748b; color: #94a3b8; }
  .tile .tip2 {
    display: none; position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    background: #1e293b; border: 1px solid #334155; border-radius: 6px;
    padding: 6px 10px; white-space: nowrap; font-size: 11px; z-index: 20;
    pointer-events: none; line-height: 1.5; color: #e2e8f0;
  }
  .tile:hover .tip2 { display: block; }

  /* Legenda */
  .legenda { display: flex; gap: 16px; flex-wrap: wrap; margin: 16px 0 20px; align-items: center; }
  .leg-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #94a3b8; }
  .leg-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .leg-dot.disponivel   { background: #22c55e; }
  .leg-dot.reservado    { background: #f59e0b; }
  .leg-dot.vendido      { background: #ef4444; }
  .leg-dot.entregue     { background: #8b5cf6; }
  .leg-dot.indisponivel { background: #64748b; }
  .leg-sim-hint { margin-left: auto; font-size: 11px; color: #475569; display: flex; align-items: center; gap: 5px; }

  /* Modal de simulação */
  .sim-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 200;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .sim-modal {
    background: #1e293b; border: 1px solid #334155; border-radius: 14px;
    max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto;
    box-shadow: 0 24px 48px rgba(0,0,0,.6);
  }
  .sim-head {
    padding: 18px 20px 14px; border-bottom: 1px solid #334155;
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .sim-head-left .sim-title { font-size: 17px; font-weight: 800; color: #f1f5f9; }
  .sim-head-left .sim-sub   { font-size: 12px; color: #64748b; margin-top: 2px; }
  .sim-close {
    background: none; border: none; color: #64748b; font-size: 20px; cursor: pointer;
    padding: 0 4px; line-height: 1; flex-shrink: 0; margin-left: 12px;
  }
  .sim-close:hover { color: #e2e8f0; }
  .sim-body { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .sim-info-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  .sim-info-cell {
    background: #0f172a; border-radius: 8px; padding: 10px 12px;
  }
  .sim-info-cell .lbl { font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 3px; }
  .sim-info-cell .val { font-size: 15px; font-weight: 700; color: #e2e8f0; }
  .sim-info-cell .val.price { color: #14b8a6; font-size: 17px; }
  .sim-section-title {
    font-size: 11px; color: #64748b; text-transform: uppercase;
    letter-spacing: .07em; margin-bottom: 8px; font-weight: 600;
  }
  .sim-entrada-box {
    background: #0f172a; border-radius: 8px; padding: 12px 14px;
  }
  .sim-entrada-row { display: flex; justify-content: space-between; align-items: baseline; }
  .sim-entrada-total { font-size: 16px; font-weight: 800; color: #fbbf24; }
  .sim-entrada-detalhe { font-size: 12px; color: #94a3b8; margin-top: 4px; }
  .sim-cond-card {
    background: #0f172a; border-radius: 8px; padding: 12px 14px;
    border-left: 3px solid #334155;
  }
  .sim-cond-card.first { border-left-color: #14b8a6; }
  .sim-cond-label { font-size: 13px; font-weight: 700; color: #e2e8f0; margin-bottom: 6px; }
  .sim-cond-rows { display: flex; flex-direction: column; gap: 3px; }
  .sim-cond-row  { display: flex; justify-content: space-between; font-size: 12px; }
  .sim-cond-key  { color: #94a3b8; }
  .sim-cond-val  { color: #e2e8f0; font-weight: 600; }
  .sim-cond-total-row { display: flex; justify-content: space-between; font-size: 13px; margin-top: 8px; padding-top: 8px; border-top: 1px solid #1e293b; }
  .sim-cond-total-lbl { color: #64748b; font-weight: 600; }
  .sim-cond-total-val { color: #e2e8f0; font-weight: 800; }
  .sim-no-params { background: #0f172a; border-radius: 8px; padding: 14px; font-size: 13px; color: #64748b; text-align: center; }
  .sim-foot {
    padding: 14px 20px; border-top: 1px solid #334155;
    display: flex; gap: 10px; justify-content: flex-end;
  }
  .btn-sim { padding: 9px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; }
  .btn-sim.secondary { background: #334155; color: #e2e8f0; }
  .btn-sim.secondary:hover { background: #475569; }
  .btn-sim.primary { background: #0d9488; color: #fff; }
  .btn-sim.primary:hover { background: #0f766e; }
  .sim-aviso { font-size: 10px; color: #475569; text-align: center; padding: 0 20px 14px; }
  /* Botão WhatsApp */
  .btn-sim.wa { background: #25d366; color: #fff; }
  .btn-sim.wa:hover { background: #1ebe5e; }
  /* Campos do formulário de proposta */
  .sim-field { display: flex; flex-direction: column; gap: 5px; }
  .sim-field label { font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
  .sim-field input, .sim-field textarea { background: #0f172a; border: 1px solid #334155; border-radius: 7px; color: #e2e8f0; font-size: 13px; padding: 8px 12px; width: 100%; font-family: inherit; }
  .sim-field input:focus, .sim-field textarea:focus { outline: none; border-color: #14b8a6; }
  .sim-field textarea { resize: vertical; min-height: 80px; }

  /* Contador regressivo */
  .refresh-bar { text-align: center; font-size: 11px; color: #475569; padding: 8px 0 4px; }
  .refresh-bar span { color: #14b8a6; font-weight: 600; }

  .loading { text-align: center; padding: 80px 24px; color: #64748b; }
  .erro    { text-align: center; padding: 60px 24px; color: #ef4444; }

  /* Vista de prédio (building sales map) */
  .predio-wrap { margin-top: 0; }
  .predio-vso { margin-bottom: 16px; }
  .predio-vso-bar { height: 7px; border-radius: 4px; background: #1e293b; overflow: hidden; display: flex; margin-bottom: 6px; }
  .predio-vso-bar > div { height: 100%; transition: width .5s ease; }
  .predio-vso-labels { display: flex; gap: 16px; font-size: 11px; flex-wrap: wrap; }
  .predio-frame { border: 1px solid #334155; border-radius: 10px; overflow: hidden; }
  .predio-andar { display: flex; align-items: stretch; border-bottom: 1px solid #1e293b; }
  .predio-andar:last-child { border-bottom: none; }
  .predio-label { width: 58px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 4px; background: #0f172a; border-right: 1px solid #1e293b; gap: 2px; }
  .predio-num { font-size: 14px; font-weight: 700; color: #f1f5f9; font-variant-numeric: tabular-nums; }
  .predio-tag { font-size: 9px; color: #475569; text-transform: uppercase; letter-spacing: .05em; }
  .predio-units { flex: 1; display: flex; gap: 8px; padding: 8px 12px; align-items: stretch; background: #0c1322; }
  .predio-unit {
    position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex: 1; min-width: 52px; max-width: 160px; height: 58px;
    border-radius: 8px; cursor: pointer; border: 1.5px solid transparent;
    transition: transform .12s;
  }
  .predio-unit:hover { transform: translateY(-3px); z-index: 5; }
  .predio-unit.disponivel  { background: #14532d; border-color: #22c55e; color: #4ade80; }
  .predio-unit.reservado   { background: #78350f; border-color: #f59e0b; color: #fbbf24; }
  .predio-unit.vendido     { background: #7f1d1d; border-color: #ef4444; color: #fca5a5; }
  .predio-unit.entregue    { background: #4c1d95; border-color: #a78bfa; color: #c4b5fd; }
  .predio-unit.indisponivel { background: #1e293b; border-color: #475569; color: #64748b; }
  .predio-unit-num  { font-size: 14px; font-weight: 700; line-height: 1; }
  .predio-unit-area { font-size: 10px; opacity: .7; margin-top: 2px; }
  .predio-unit .tip2 {
    display: none; position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    background: #1e293b; border: 1px solid #334155; border-radius: 6px;
    padding: 6px 10px; white-space: nowrap; font-size: 11px; z-index: 20;
    pointer-events: none; line-height: 1.5; color: #e2e8f0;
  }
  .predio-unit:hover .tip2 { display: block; }

  /* Tela média (tablet) */
  @media (max-width: 900px) {
    .grade {
      grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
      gap: 7px;
    }
    .tile { min-height: 58px; }
  }

  /* Mobile */
  @media (max-width: 600px) {
    header { padding: 12px 16px; }
    .logo { font-size: 17px; }
    .resumo { padding: 10px 14px; gap: 7px; }
    .resumo-card { min-width: 72px; padding: 10px 12px; }
    .resumo-card .num { font-size: 22px; }
    .maps-btn, .drive-btn, .social-btn, .export-btn { padding: 10px 14px; font-size: 12px; }
    main { padding: 0 12px 24px; }
    .grade {
      grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
      gap: 6px;
    }
    .tile { min-height: 52px; border-radius: 8px; }
    .tile .lote-num { font-size: 13px; }
    .tile .quadra { font-size: 9px; }
    .sim-info-grid { grid-template-columns: 1fr; }
    .predio-label { width: 44px; }
    .predio-num { font-size: 12px; }
    .predio-units { padding: 6px 8px; gap: 5px; }
    .predio-unit { min-width: 44px; height: 48px; border-radius: 7px; }
    .predio-unit-num { font-size: 12px; }
    .predio-unit-area { font-size: 9px; }
    .legenda { gap: 10px; }
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">R2X <span>CRM</span></div>
    <div class="subtitle" id="emp-nome">Carregando...</div>
  </div>
  <div class="atualizado">
    Espelho de Vendas — Tempo Real<br>
    <strong id="hora-atual">—</strong>
  </div>
</header>

<div class="resumo" id="resumo">
  <div class="resumo-card total"><div class="num" id="r-total">—</div><div class="label">Total</div></div>
  <div class="resumo-card disp"><div class="num" id="r-disp">—</div><div class="label">Disponível</div></div>
  <div class="resumo-card res"><div class="num" id="r-res">—</div><div class="label">Reservado</div></div>
  <div class="resumo-card vend"><div class="num" id="r-vend">—</div><div class="label">Vendido</div></div>
  <div class="resumo-card indisp" id="r-indisp-card" style="display:none"><div class="num" id="r-indisp">0</div><div class="label">Indisponível</div></div>
  <a id="maps-btn" href="#" target="_blank" rel="noopener" class="maps-btn" style="display:none">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
    Ver no Maps
  </a>
  <a id="drive-btn" href="#" target="_blank" rel="noopener" class="drive-btn" style="display:none">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19H2l5-9h10l5 9z"/><path d="M7.5 14L12 6l4.5 8"/><path d="M2 19l5-9"/></svg>
    Material de divulgação
  </a>
  <a id="social-btn" href="#" target="_blank" rel="noopener" class="social-btn" style="display:none">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
    Redes Sociais
  </a>
  <button id="export-btn" class="export-btn" onclick="exportarTabelaEspelho()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
    Exportar Tabela
  </button>
  <button id="pdf-btn" class="export-btn" style="display:none;background:#7c3aed;border-color:#6d28d9" onclick="baixarTabelaPDF()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Baixar PDF
  </button>
  <div id="corretor-area">
    <button class="corretor-btn" onclick="abrirLoginCorretor()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Sou Corretor
    </button>
  </div>
</div>

<!-- Modal login corretor -->
<div id="modal-login" class="modal-overlay">
  <div class="modal-box">
    <h3>🔐 Acesso Corretor</h3>
    <label>E-mail</label>
    <input id="login-email" type="email" placeholder="seu@email.com" autocomplete="username">
    <label>Senha</label>
    <input id="login-senha" type="password" placeholder="••••••••" autocomplete="current-password">
    <div id="login-err" class="modal-err"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="fecharModal('modal-login')">Cancelar</button>
      <button class="btn-confirm" onclick="fazerLogin()">Entrar</button>
    </div>
  </div>
</div>

<!-- Modal cadastrar lead -->
<div id="modal-lead" class="modal-overlay">
  <div class="modal-box">
    <h3>📋 Cadastrar Lead</h3>
    <p id="lead-unidade-desc" style="font-size:12px;color:#94a3b8;margin-bottom:4px"></p>
    <label>Nome do cliente *</label>
    <input id="lead-nome" type="text" placeholder="Nome completo">
    <label>Telefone / WhatsApp *</label>
    <input id="lead-tel" type="tel" placeholder="(48) 99999-9999">
    <label>E-mail</label>
    <input id="lead-email" type="email" placeholder="cliente@email.com">
    <label>Observações</label>
    <textarea id="lead-obs" placeholder="Interesse, timing, perfil..."></textarea>
    <div id="lead-err" class="modal-err"></div>
    <div id="lead-ok"  class="modal-ok"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="fecharModal('modal-lead')">Cancelar</button>
      <button id="lead-submit-btn" class="btn-confirm" onclick="enviarLead()">Cadastrar</button>
    </div>
  </div>
</div>

<main>
  <div id="conteudo"><div class="loading">Carregando espelho de vendas...</div></div>
  <div class="refresh-bar">Atualiza automaticamente em <span id="countdown">15</span>s</div>
</main>

<script>
const slug = location.pathname.split('/espelho/')[1]?.split('/')[0];
let countdown = 15, timer;
let _empNome = '';
let _empTipo = 'loteamento';
let _simParams = null;

// ── Auth corretor ─────────────────────────────────────────────────────────────
let _corretorToken    = localStorage.getItem('espelho_token')    || null;
let _corretorNome     = localStorage.getItem('espelho_nome')     || null;
let _corretorId       = localStorage.getItem('espelho_corretor') || null;
let _leadUnitId       = null;

function abrirLoginCorretor() {
  document.getElementById('login-email').value = '';
  document.getElementById('login-senha').value = '';
  document.getElementById('login-err').style.display = 'none';
  document.getElementById('modal-login').classList.add('open');
  setTimeout(() => document.getElementById('login-email').focus(), 50);
}

function fecharModal(id) {
  document.getElementById(id).classList.remove('open');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-overlay.open').forEach(m => m.classList.remove('open'));
  }
  if (e.key === 'Enter' && document.getElementById('modal-login').classList.contains('open')) fazerLogin();
  if (e.key === 'Enter' && document.getElementById('modal-lead').classList.contains('open')) enviarLead();
});

async function fazerLogin() {
  const email = document.getElementById('login-email').value.trim();
  const senha = document.getElementById('login-senha').value;
  const errEl = document.getElementById('login-err');
  errEl.style.display = 'none';
  if (!email || !senha) { errEl.textContent = 'Preencha e-mail e senha.'; errEl.style.display = 'block'; return; }
  try {
    const r = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email, senha}) });
    const d = await r.json();
    if (!d.ok) { errEl.textContent = d.error || 'Credenciais inválidas.'; errEl.style.display = 'block'; return; }
    if (!['corretor','gestor','admin'].includes(d.data?.perfil)) {
      errEl.textContent = 'Acesso permitido apenas para corretores.'; errEl.style.display = 'block'; return;
    }
    _corretorToken = d.data.token;
    _corretorNome  = d.data.nome;
    _corretorId    = d.data.corretor_id;
    localStorage.setItem('espelho_token',    _corretorToken);
    localStorage.setItem('espelho_nome',     _corretorNome);
    localStorage.setItem('espelho_corretor', _corretorId||'');
    fecharModal('modal-login');
    renderCorretorArea();
  } catch(e) {
    errEl.textContent = 'Erro de conexão.'; errEl.style.display = 'block';
  }
}

function fazerLogout() {
  _corretorToken = null; _corretorNome = null; _corretorId = null;
  localStorage.removeItem('espelho_token');
  localStorage.removeItem('espelho_nome');
  localStorage.removeItem('espelho_corretor');
  renderCorretorArea();
}

function renderCorretorArea() {
  const el = document.getElementById('corretor-area');
  if (!el) return;
  if (_corretorToken && _corretorNome) {
    el.innerHTML = `<div class="corretor-logado">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      ${_corretorNome}
      <button onclick="fazerLogout()">Sair</button>
    </div>`;
  } else {
    el.innerHTML = `<button class="corretor-btn" onclick="abrirLoginCorretor()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Sou Corretor
    </button>`;
  }
}

function abrirCadastrarLead(unitId) {
  const u = (window._units||[]).find(x=>x.id===unitId);
  _leadUnitId = unitId;
  document.getElementById('lead-nome').value  = '';
  document.getElementById('lead-tel').value   = '';
  document.getElementById('lead-email').value = '';
  document.getElementById('lead-obs').value   = '';
  document.getElementById('lead-err').style.display = 'none';
  document.getElementById('lead-ok').style.display  = 'none';
  document.getElementById('lead-submit-btn').disabled = false;
  document.getElementById('lead-unidade-desc').textContent = u
    ? `Interesse: ${u.lote}${u.quadra?' — '+u.quadra:''}`
    : '';
  document.getElementById('modal-lead').classList.add('open');
  setTimeout(() => document.getElementById('lead-nome').focus(), 50);
}

async function enviarLead() {
  const nome  = document.getElementById('lead-nome').value.trim();
  const tel   = document.getElementById('lead-tel').value.trim();
  const email = document.getElementById('lead-email').value.trim();
  const obs   = document.getElementById('lead-obs').value.trim();
  const errEl = document.getElementById('lead-err');
  const okEl  = document.getElementById('lead-ok');
  errEl.style.display = 'none'; okEl.style.display = 'none';
  if (!nome) { errEl.textContent = 'Nome obrigatório.'; errEl.style.display = 'block'; return; }
  if (!tel)  { errEl.textContent = 'Telefone obrigatório.'; errEl.style.display = 'block'; return; }
  const u = _leadUnitId ? (window._units||[]).find(x=>x.id===_leadUnitId) : null;
  const btn = document.getElementById('lead-submit-btn');
  btn.disabled = true; btn.textContent = 'Salvando...';
  try {
    const r = await fetch('/api/espelho-lead', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'x-crm-token': _corretorToken },
      body: JSON.stringify({
        nome, telefone: tel, email: email||null,
        observacoes: obs||null,
        slug,
        unidade_interesse: u ? `${u.lote}${u.quadra?' — '+u.quadra:''}` : null
      })
    });
    const d = await r.json();
    if (!d.ok) { errEl.textContent = d.error||'Erro ao cadastrar.'; errEl.style.display='block'; btn.disabled=false; btn.textContent='Cadastrar'; return; }
    okEl.textContent = d.data?.existente ? '✓ Lead já existe no sistema — corretor atualizado.' : '✓ Lead cadastrado com sucesso!';
    okEl.style.display = 'block';
    btn.textContent = '✓ Cadastrado';
    setTimeout(() => fecharModal('modal-lead'), 2000);
  } catch(e) {
    errEl.textContent = 'Erro de conexão.'; errEl.style.display='block'; btn.disabled=false; btn.textContent='Cadastrar';
  }
}

// Inicializar área do corretor ao carregar
renderCorretorArea();
let _markerSize = 20;
let _mapsUrl = null;
let _driveUrl = null;
let _socialUrl = null;

const fmt  = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', minimumFractionDigits: 2 });
const fmt0 = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });

function statusLabel(s) {
  return { disponivel: 'Disponível', reservado: 'Reservado', vendido: 'Vendido', entregue: 'Vendido', indisponivel: 'Indisponível' }[s] || s;
}

// ── Cálculo PMT (Price) ──────────────────────────────────────────────────────
function calcPMT(saldo, nParc, juros) {
  if (saldo <= 0 || nParc <= 0) return 0;
  if (!juros) return saldo / nParc;
  const i = juros / 100;
  return saldo * (i * Math.pow(1+i, nParc)) / (Math.pow(1+i, nParc) - 1);
}

// ── Simulação ────────────────────────────────────────────────────────────────
function abrirSimulacao(unitId) {
  const u = (window._units || []).find(x => x.id === unitId);
  if (!u) return;

  const p = _simParams;
  const preco = u.preco;

  // Calcula entrada e condições
  let entV = 0, entLabel = '', entDetalhe = '';
  let condsHtml = '';

  if (p && preco) {
    const entFixo = p.entrada_tipo === 'valor';
    entV = entFixo ? (p.entrada_valor || 0) : preco * ((p.entrada_pct || 0) / 100);
    const entParcN = p.entrada_parc || 1;
    const pctFmt = entFixo ? fmt0.format(entV) : ((p.entrada_pct||0).toFixed(0) + '% — ' + fmt0.format(entV));
    entLabel = fmt.format(entV);
    entDetalhe = entParcN > 1
      ? `${entParcN}× de ${fmt.format(entV / entParcN)}`
      : 'à vista';

    const totalRef = preco * ((p.pRef || 0) / 100);
    const saldo = preco - entV - totalRef;
    const condicoes = p.condicoes || [];

    condsHtml = condicoes.map((c, i) => {
      const pmv = calcPMT(saldo, c.nParc, c.juros || 0);
      const totalCond = entV + totalRef + c.nParc * pmv;
      const semJuros = !c.juros;
      const chk = semJuros && Math.abs(totalCond - preco) < 1 ? ' ✓' : '';
      const balaoInfo = totalRef > 0 ? `<div class="sim-cond-row"><span class="sim-cond-key">Balões</span><span class="sim-cond-val">${fmt0.format(totalRef)}</span></div>` : '';
      return `<div class="sim-cond-card${i === 0 ? ' first' : ''}">
        <div class="sim-cond-label">${c.label || c.nParc + 'x'} ${c.juros > 0 ? '· ' + c.juros.toFixed(2) + '% a.m.' : '· sem juros'}</div>
        <div class="sim-cond-rows">
          ${balaoInfo}
          <div class="sim-cond-row">
            <span class="sim-cond-key">${c.nParc}× parcelas</span>
            <span class="sim-cond-val">${fmt.format(pmv)}/mês</span>
          </div>
        </div>
        <div class="sim-cond-total-row">
          <span class="sim-cond-total-lbl">Total${chk}</span>
          <span class="sim-cond-total-val">${fmt0.format(totalCond)}</span>
        </div>
      </div>`;
    }).join('');
  }

  const dispVendido = u.status === 'vendido' || u.status === 'reservado';
  const statusBadge = dispVendido
    ? `<span style="background:${u.status==='vendido'?'#7f1d1d':'#78350f'};color:${u.status==='vendido'?'#fca5a5':'#fbbf24'};padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700">${statusLabel(u.status).toUpperCase()}</span>`
    : '';

  const semParamsHtml = !p || !preco ? `<div class="sim-no-params">
    ${!preco ? 'Este lote não possui valor cadastrado.' : 'Condições de pagamento ainda não configuradas pelo empreendedor.'}
  </div>` : '';

  // Build footer + optional form screen (screen-2)
  const propostaBtn = (p && preco && u.status === 'disponivel')
    ? '<button class="btn-sim wa" onclick="mostrarFormProposta(' + unitId + ')">📲 Proposta</button>'
    : '';
  const formFields = [
    '<div class="sim-field"><label>Nome do Cliente *</label><input id="sf-cliente" type="text" placeholder="Ex: João da Silva" autocomplete="off"></div>',
    '<div class="sim-field"><label>CPF do Cliente</label><input id="sf-cpf" type="text" placeholder="000.000.000-00" oninput="fmtCPF(this)" maxlength="14" autocomplete="off"></div>',
    '<div class="sim-field"><label>Nome do Corretor *</label><input id="sf-corretor" type="text" placeholder="Seu nome" autocomplete="off"></div>',
    '<div class="sim-field"><label>Proposta</label><textarea id="sf-proposta" rows="5"></textarea></div>',
    '<div class="sim-field"><label>Observações</label><textarea id="sf-obs" rows="2" placeholder="Observações adicionais..."></textarea></div>'
  ].join('');
  const leadBtn = _corretorToken
    ? `<button class="btn-sim" style="background:#0f766e;border:1px solid #0d9488" onclick="abrirCadastrarLead(${unitId})">📋 Lead</button>`
    : '';
  const footerContent = p && preco
    ? `<div class="sim-foot">
        <button class="btn-sim secondary" onclick="fecharSimulacao()">Fechar</button>
        <button class="btn-sim primary" onclick="gerarPDFSimulacao(${unitId})">🖨️ PDF</button>
        ${propostaBtn}
        ${leadBtn}
      </div>
      <div class="sim-aviso">* Simulação sujeita a alterações. Consulte a equipe da R2X.</div>
      </div>
      <div id="sim-screen-2" style="display:none">
        <div class="sim-body" style="border-top:1px solid #334155">
          <div style="font-size:12px;color:#64748b;padding:0 0 8px">Preencha para enviar a proposta via WhatsApp:</div>
          ${formFields}
        </div>
        <div class="sim-foot">
          <button class="btn-sim secondary" onclick="voltarParaSimulacao()">← Voltar</button>
          <button class="btn-sim wa" onclick="enviarPropostaWA(${unitId})">📲 Enviar WhatsApp</button>
        </div>
      </div>`
    : '<div class="sim-foot"><button class="btn-sim secondary" onclick="fecharSimulacao()">Fechar</button></div></div>';

  const modalHtml = `<div class="sim-overlay" id="sim-overlay" onclick="if(event.target===this)fecharSimulacao()">
    <div class="sim-modal">
      <div class="sim-head">
        <div class="sim-head-left">
          <div class="sim-title">Lote ${u.lote}${u.quadra ? ' · Quadra ' + u.quadra : ''} ${statusBadge}</div>
          <div class="sim-sub">${_empNome}</div>
        </div>
        <button class="sim-close" onclick="fecharSimulacao()">✕</button>
      </div>
      <div id="sim-screen-1">
      <div class="sim-body">
        <div class="sim-info-grid">
          ${u.area_m2 ? `<div class="sim-info-cell"><div class="lbl">Área</div><div class="val">${Number(u.area_m2).toLocaleString('pt-BR', {minimumFractionDigits:2})} m²</div></div>` : ''}
          ${preco ? `<div class="sim-info-cell"><div class="lbl">Valor</div><div class="val price">${fmt0.format(preco)}</div></div>` : ''}
        </div>

        ${p && preco && entV > 0 ? `
        <div>
          <div class="sim-section-title">Entrada</div>
          <div class="sim-entrada-box">
            <div class="sim-entrada-row">
              <span style="font-size:13px;color:#94a3b8">Valor da entrada</span>
              <span class="sim-entrada-total">${entLabel}</span>
            </div>
            <div class="sim-entrada-detalhe">${entDetalhe}</div>
          </div>
        </div>` : ''}

        ${condsHtml ? `<div><div class="sim-section-title">Condições de Parcelamento</div><div style="display:flex;flex-direction:column;gap:8px">${condsHtml}</div></div>` : semParamsHtml}
      </div>
      ${footerContent}
    </div>
  </div>`;

  document.body.insertAdjacentHTML('beforeend', modalHtml);
}

function fecharSimulacao() {
  document.getElementById('sim-overlay')?.remove();
}

function mostrarFormProposta(unitId) {
  const u = (window._units || []).find(x => x.id === unitId);
  if (!u) return;
  const p = _simParams;
  const preco = u.preco;

  // Pré-preenche o textarea de proposta
  let txt = `Empreendimento: ${_empNome}\n`;
  txt += `Lote: ${u.lote}${u.quadra ? ' · Quadra ' + u.quadra : ''}`;
  if (u.area_m2) txt += ` · ${Number(u.area_m2).toLocaleString('pt-BR', {minimumFractionDigits:2})}m²`;
  txt += `\nValor: ${fmt0.format(preco)}\n`;
  if (p && preco) {
    const entFixo = p.entrada_tipo === 'valor';
    const entV    = entFixo ? (p.entrada_valor || 0) : preco * ((p.entrada_pct || 0) / 100);
    const entParcN = p.entrada_parc || 1;
    txt += `Entrada: ${fmt.format(entV)}`;
    txt += entParcN > 1 ? ` (${entParcN}x de ${fmt.format(entV / entParcN)})` : ' (à vista)';
    txt += '\n';
    const totalRef = preco * ((p.pRef || 0) / 100);
    const nRef     = p.nRef || 0;
    const saldo    = preco - entV - totalRef;
    if (totalRef > 0 && nRef > 0) {
      txt += `Balões: ${nRef}x de ${fmt.format(totalRef / nRef)} (${((p.pRef||0)).toFixed(0)}% do valor)\n`;
    }
    (p.condicoes || []).forEach(c => {
      const pmv = calcPMT(saldo, c.nParc, c.juros || 0);
      txt += `${c.label || c.nParc + 'x'}: ${c.nParc}x ${fmt.format(pmv)}/mês`;
      if (c.juros > 0) txt += ` (${c.juros.toFixed(2)}% a.m.)`;
      txt += '\n';
    });
  }

  document.getElementById('sim-screen-1').style.display = 'none';
  document.getElementById('sim-screen-2').style.display = '';
  const el = document.getElementById('sf-proposta');
  if (el && !el.value) el.value = txt.trim();
  document.getElementById('sf-cliente')?.focus();
}

function voltarParaSimulacao() {
  document.getElementById('sim-screen-2').style.display = 'none';
  document.getElementById('sim-screen-1').style.display = '';
}

function fmtCPF(input) {
  let v = input.value.replace(/\D/g, '').slice(0, 11);
  if (v.length > 9)      v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{0,2})/, '$1.$2.$3-$4');
  else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{0,3})/, '$1.$2.$3');
  else if (v.length > 3) v = v.replace(/(\d{3})(\d{0,3})/, '$1.$2');
  input.value = v;
}

function enviarPropostaWA(unitId) {
  const cliente  = (document.getElementById('sf-cliente')?.value  || '').trim();
  const cpf      = (document.getElementById('sf-cpf')?.value      || '').trim();
  const corretor = (document.getElementById('sf-corretor')?.value || '').trim();
  const proposta = (document.getElementById('sf-proposta')?.value || '').trim();
  const obs      = (document.getElementById('sf-obs')?.value      || '').trim();

  if (!cliente)  { alert('Informe o nome do cliente.');   return; }
  if (!corretor) { alert('Informe o nome do corretor.'); return; }

  const partes = [
    '📋 *PROPOSTA DE COMPRA — R2X*',
    '━━━━━━━━━━━━━━━━━━━━━',
    '',
    `👤 *Cliente:* ${cliente}`,
    cpf      ? `🪪 *CPF:* ${cpf}` : null,
    `👨‍💼 *Corretor:* ${corretor}`,
    '',
    '💳 *Proposta:*',
    proposta,
    obs ? `\n📝 *Obs:* ${obs}` : null,
    '',
    '_Enviado via R2X Espelho de Vendas_'
  ].filter(l => l !== null).join('\n');

  window.open('https://wa.me/5548988228031?text=' + encodeURIComponent(partes), '_blank');
}

// ── PDF por lote ─────────────────────────────────────────────────────────────
function gerarPDFSimulacao(unitId) {
  const u = (window._units || []).find(x => x.id === unitId);
  if (!u) return;
  const p = _simParams;
  const preco = u.preco;
  const hoje = new Date().toLocaleDateString('pt-BR');

  let entV = 0, condsRows = '';
  if (p && preco) {
    const entFixo = p.entrada_tipo === 'valor';
    entV = entFixo ? (p.entrada_valor || 0) : preco * ((p.entrada_pct || 0) / 100);
    const entParcN = p.entrada_parc || 1;
    const totalRef = preco * ((p.pRef || 0) / 100);
    const saldo    = preco - entV - totalRef;
    const condicoes = p.condicoes || [];

    condsRows = condicoes.map((c, i) => {
      const pmv = calcPMT(saldo, c.nParc, c.juros || 0);
      const totalCond = entV + totalRef + c.nParc * pmv;
      const semJuros  = !c.juros;
      const chk = semJuros && Math.abs(totalCond - preco) < 1 ? ' ✓' : '';
      const balaoRow = totalRef > 0 ? `<tr><td>Balões (${((p.pRef||0)).toFixed(0)}%)</td><td>${fmt0.format(totalRef)}</td></tr>` : '';
      return `
        <tr class="cond-header ${i===0?'first':''}">
          <td colspan="2">${c.label || c.nParc + 'x'} — ${c.juros > 0 ? c.juros.toFixed(2) + '% a.m.' : 'sem juros'}</td>
        </tr>
        ${balaoRow}
        <tr><td>${c.nParc} parcelas mensais</td><td>${fmt.format(pmv)}/mês</td></tr>
        <tr class="total-row"><td>Total${chk}</td><td>${fmt0.format(totalCond)}</td></tr>`;
    }).join('');
  }

  const entParcN = p?.entrada_parc || 1;
  const entDetalhe = entParcN > 1 ? ` — ${entParcN}× de ${fmt.format(entV / entParcN)}` : ' — à vista';

  const html = `<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8">
<title>Simulação — Lote ${u.lote}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; color: #111; padding: 24px 32px; font-size: 13px; }
  @page { size: A4 portrait; margin: 15mm 18mm; }
  .header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 3px solid #111; padding-bottom: 12px; margin-bottom: 20px; }
  .header-left h1 { font-size: 20px; font-weight: 900; }
  .header-left p { font-size: 11px; color: #666; margin-top: 3px; }
  .header-right { text-align: right; }
