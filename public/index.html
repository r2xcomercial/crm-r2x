<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CRM R2X</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0D1B2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="R2X CRM">
<link rel="apple-touch-icon" href="/icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --navy: #0D1B2E;
    --navy2: #142236;
    --navy3: #1E3352;
    --accent: #00C4B4;
    --accent2: #0099CC;
    --success: #22C55E;
    --warning: #F59E0B;
    --danger: #EF4444;
    --text: #E8EDF5;
    --text2: #94A3B8;
    --border: #243650;
    --card: #162032;
    --card2: #1A2840;
    --white: #FFFFFF;
    --sidebar-w: 240px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--navy); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
  #main::before { content: ''; position: fixed; inset: 0; background: url('/icon-512.png') center center / 420px no-repeat; opacity: .03; pointer-events: none; z-index: 0; }
  #content { position: relative; z-index: 1; }

  /* ── SIDEBAR ── */
  #sidebar {
    width: var(--sidebar-w); background: var(--navy2); display: flex; flex-direction: column;
    border-right: 1px solid var(--border); flex-shrink: 0; transition: width .25s;
  }
  .sidebar-logo {
    padding: 20px 16px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .logo-mark { width: 36px; height: 36px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 900; color: var(--navy); font-size: 16px; flex-shrink: 0; }
  .logo-text { font-size: 15px; font-weight: 700; color: var(--white); line-height: 1.2; }
  .logo-sub { font-size: 10px; color: var(--text2); font-weight: 400; }
  nav { flex: 1; overflow-y: auto; padding: 10px 0; }
  .nav-section { padding: 14px 16px 4px; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text2); font-weight: 600; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    cursor: pointer; color: var(--text2); font-size: 13.5px; border-radius: 0;
    transition: all .15s; position: relative; border-left: 3px solid transparent;
  }
  .nav-item:hover { background: var(--navy3); color: var(--text); }
  .nav-item.active { background: rgba(0,196,180,.1); color: var(--accent); border-left-color: var(--accent); }
  .nav-item .icon { font-size: 17px; width: 20px; text-align: center; }
  .nav-badge { background: var(--accent); color: var(--navy); font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px; margin-left: auto; }

  /* ── MAIN ── */
  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #topbar {
    height: 56px; background: var(--navy2); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 24px; gap: 16px; flex-shrink: 0;
  }
  #page-title { font-size: 17px; font-weight: 600; flex: 1; }
  .topbar-btn {
    background: var(--accent); color: var(--navy); border: none; padding: 7px 16px;
    border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px;
    transition: opacity .15s;
  }
  .topbar-btn:hover { opacity: .85; }
  .topbar-search {
    background: var(--navy3); border: 1px solid var(--border); color: var(--text);
    padding: 7px 12px; border-radius: 6px; font-size: 13px; width: 200px; outline: none;
  }
  .topbar-search:focus { border-color: var(--accent); }
  #content { flex: 1; overflow-y: auto; padding: 24px; }

  /* ── CARDS ── */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px,1fr)); gap: 16px; margin-bottom: 24px; }
  .kpi-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px; display: flex; flex-direction: column; gap: 6px; min-width: 0;
  }
  .kpi-label { font-size: 12px; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; }
  .kpi-value { font-weight: 700; color: var(--white); white-space: normal; word-break: break-word; font-size: clamp(13px, 1.6vw, 22px); line-height: 1.2; }
  .kpi-sub { font-size: 12px; color: var(--text2); }
  .kpi-icon { font-size: 22px; margin-bottom: 4px; }

  /* ── TABLES ── */
  .table-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
  .table-header { padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
  .table-title { font-size: 14px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; }
  th { padding: 10px 16px; text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--text2); background: var(--card2); border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 12px 16px; font-size: 13px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,.03); }
  .empty-row td { text-align: center; color: var(--text2); padding: 32px; }

  /* ── BADGES ── */
  .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
  .badge-green { background: rgba(34,197,94,.15); color: #4ade80; }
  .badge-blue { background: rgba(0,153,204,.15); color: #38bdf8; }
  .badge-yellow { background: rgba(245,158,11,.15); color: #fbbf24; }
  .badge-red { background: rgba(239,68,68,.15); color: #f87171; }
  .badge-gray { background: rgba(148,163,184,.12); color: var(--text2); }
  .badge-accent { background: rgba(0,196,180,.15); color: var(--accent); }
  .badge-orange { background: rgba(251,146,60,.15); color: #fb923c; }
  .modal-wide { max-width: 860px !important; }

  /* ── ACTION BUTTONS ── */
  .btn-icon { background: none; border: none; cursor: pointer; padding: 4px 6px; border-radius: 4px; font-size: 15px; transition: background .15s; }
  .btn-icon:hover { background: var(--navy3); }
  .btn-edit { color: var(--accent2); }
  .btn-delete { color: var(--danger); }
  .btn { padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: opacity .15s; }
  .btn:hover { opacity: .85; }
  .btn-primary { background: var(--accent); color: var(--navy); }
  .btn-secondary { background: var(--navy3); color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: var(--danger); color: white; }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 1000;
    display: flex; align-items: center; justify-content: center; padding: 20px;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    width: 100%; max-width: 560px; max-height: 90vh; display: flex; flex-direction: column;
    transform: translateY(20px); transition: transform .2s;
  }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-head { padding: 20px 24px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .modal-title { font-size: 16px; font-weight: 700; }
  .modal-close { background: none; border: none; color: var(--text2); font-size: 20px; cursor: pointer; padding: 4px; line-height: 1; }
  .modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; }
  .modal-foot { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }

  /* ── FORM ── */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-grid.cols1 { grid-template-columns: 1fr; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group.span2 { grid-column: span 2; }
  label { font-size: 12px; color: var(--text2); font-weight: 500; }
  input, select, textarea {
    background: var(--navy3); border: 1px solid var(--border); color: var(--text);
    padding: 9px 12px; border-radius: 6px; font-size: 13px; outline: none; width: 100%;
    transition: border-color .15s;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  select option { background: var(--navy2); }
  textarea { resize: vertical; min-height: 72px; }

  /* ── DASHBOARD EXTRAS ── */
  .dash-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  .dash-row.cols3 { grid-template-columns: 1fr 1fr 1fr; }
  .mini-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; }
  .mini-card h4 { font-size: 13px; color: var(--text2); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .funil-bar { display: flex; flex-direction: column; gap: 8px; }
  .funil-item { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .funil-track { flex: 1; background: var(--navy3); border-radius: 4px; height: 8px; overflow: hidden; }
  .funil-fill { height: 100%; border-radius: 4px; background: var(--accent); transition: width .5s; }
  .funil-count { font-size: 12px; color: var(--text2); min-width: 28px; text-align: right; }
  .aniv-list { display: flex; flex-direction: column; gap: 8px; }
  .aniv-item { display: flex; align-items: center; gap: 10px; font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .aniv-item:last-child { border-bottom: none; }
  .aniv-avatar { width: 32px; height: 32px; background: var(--navy3); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
  .launch-list { display: flex; flex-direction: column; gap: 10px; }
  .launch-item { display: flex; align-items: center; gap: 12px; font-size: 13px; }
  .launch-date { background: var(--navy3); border-radius: 6px; padding: 4px 8px; font-size: 11px; color: var(--accent); white-space: nowrap; font-weight: 600; }

  /* ── FINANCEIRO ── */
  .fin-tabs { display: flex; gap: 4px; margin-bottom: 20px; }
  .fin-tab { padding: 8px 18px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); color: var(--text2); background: none; transition: all .15s; }
  .fin-tab.active { background: var(--accent); color: var(--navy); border-color: var(--accent); }

  /* ── TOAST ── */
  #toast { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .toast-item { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 18px; font-size: 13px; display: flex; align-items: center; gap: 10px; min-width: 240px; animation: slideIn .25s ease; box-shadow: 0 8px 32px rgba(0,0,0,.4); }
  .toast-item.success { border-left: 3px solid var(--success); }
  .toast-item.error { border-left: 3px solid var(--danger); }
  @keyframes slideIn { from { transform: translateX(30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── RESPONSIVE ── */
  #sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200; }
  #sidebar-overlay.open { display: block; }
  #menu-btn { display: none; background: none; border: none; color: var(--text); font-size: 24px; cursor: pointer; padding: 0 10px 0 0; line-height: 1; }
  @media(max-width: 768px) {
    body { overflow: auto; }
    #sidebar { position: fixed; left: -280px; top: 0; bottom: 0; z-index: 300; transition: left .25s ease; width: 260px; overflow-y: auto; }
    #sidebar.open { left: 0; box-shadow: 4px 0 24px rgba(0,0,0,.5); }
    #menu-btn { display: inline-block; }
    #main { width: 100%; overflow: auto; }
    #content { overflow: auto; padding: 16px; }
    .form-grid { grid-template-columns: 1fr; }
    .form-group.span2 { grid-column: span 1; }
    .dash-row, .dash-row.cols3 { grid-template-columns: 1fr; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    #topbar { gap: 6px; padding: 0 12px; }
    .topbar-search { min-width: 0; flex: 1; font-size: 13px; }
    .table-card { overflow-x: auto; }
    table { font-size: 12px; min-width: 480px; }
    th, td { padding: 8px 10px; white-space: nowrap; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .kpi-card { padding: 14px; }
    .modal { max-width: 100%; margin: 0 10px; }
  }
</style>
</head>
<body>

<!-- SIDEBAR -->
<div id="sidebar">
  <div class="sidebar-logo">
    <img src="/icon-192.png" style="width:36px;height:36px;border-radius:8px;flex-shrink:0">
    <div>
      <div class="logo-text">R2X CRM</div>
      <div class="logo-sub">Inteligência Comercial em Lançamentos</div>
    </div>
  </div>
  <nav>
    <div class="nav-section">Principal</div>
    <div class="nav-item active" onclick="navigate('dashboard')"><span class="icon">📊</span> Dashboard</div>
    <div class="nav-item" onclick="navigate('calendario')"><span class="icon">📅</span> Calendário</div>

    <div class="nav-section">Comercial</div>
    <div class="nav-item" onclick="navigate('leads')"><span class="icon">🎯</span> Leads <span class="nav-badge" id="badge-leads">0</span></div>
    <div class="nav-item" onclick="navigate('vendas')"><span class="icon">🏆</span> Vendas</div>
    <div class="nav-item" onclick="navigate('ranking')"><span class="icon">⭐</span> Ranking</div>

    <div class="nav-section">Cadastros</div>
    <div class="nav-item" onclick="navigate('clientes')"><span class="icon">🏢</span> Incorporadores</div>
    <div class="nav-item" onclick="navigate('empreendimentos')"><span class="icon">🏗️</span> Empreendimentos</div>
    <div class="nav-item" onclick="navigate('corretores')"><span class="icon">👥</span> Corretores</div>

    <div class="nav-section">Financeiro</div>
    <div class="nav-item" onclick="navigate('financeiro')"><span class="icon">💰</span> Financeiro</div>
  </nav>
</div>

<!-- OVERLAY MOBILE -->
<div id="sidebar-overlay" onclick="closeSidebar()"></div>

<!-- MAIN -->
<div id="main">
  <div id="topbar">
    <button id="menu-btn" onclick="toggleSidebar()">☰</button>
    <div id="page-title">Dashboard</div>
    <input class="topbar-search" type="text" id="search-box" placeholder="🔍  Buscar..." oninput="handleSearch(this.value)">
    <button class="topbar-btn" id="add-btn" onclick="handleAdd()" style="display:none">+ Novo</button>
  </div>
  <div id="content"><!-- rendered by JS --></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModalOutside(event)">
  <div class="modal" id="modal">
    <div class="modal-head">
      <div class="modal-title" id="modal-title">Título</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
const API = '';
let currentPage = 'dashboard';
let currentData = {};

// ─── NAVIGATION ───────────────────────────────────────────────────────────────

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('open');
}

function navigate(page) {
  currentPage = page;
  closeSidebar();
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.querySelector(`.nav-item[onclick="navigate('${page}')"]`)?.classList.add('active');
  document.getElementById('page-title').textContent = pageTitles[page] || page;
  document.getElementById('search-box').value = '';
  document.getElementById('add-btn').style.display = addablePages.includes(page) ? 'flex' : 'none';
  renderPage(page);
}

const pageTitles = {
  dashboard: 'Dashboard', leads: 'Leads', vendas: 'Vendas',
  clientes: 'Incorporadores', empreendimentos: 'Empreendimentos', corretores: 'Corretores',
  financeiro: 'Financeiro', calendario: 'Calendário de Lançamentos', ranking: 'Ranking de Corretores'
};
const addablePages = ['leads','vendas','clientes','empreendimentos','corretores','financeiro','calendario'];

async function renderPage(page) {
  const c = document.getElementById('content');
  c.innerHTML = `<div style="text-align:center;padding:60px;color:var(--text2)">Carregando...</div>`;
  try {
    switch(page) {
      case 'dashboard': await renderDashboard(); break;
      case 'leads': await renderLeads(); break;
      case 'vendas': await renderVendas(); break;
      case 'clientes': await renderClientes(); break;
      case 'empreendimentos': await renderEmpreendimentos(); break;
      case 'corretores': await renderCorretores(); break;
      case 'financeiro': await renderFinanceiro(); break;
      case 'calendario': await renderCalendario(); break;
      case 'ranking': await renderRanking(); break;
    }
  } catch(e) {
    c.innerHTML = `<div style="color:var(--danger);padding:24px">Erro ao carregar: ${e.message}</div>`;
  }
}

// ─── API HELPERS ──────────────────────────────────────────────────────────────

const TOKEN = localStorage.getItem('crm_token') || '';
if (!TOKEN) { window.location.href = '/login.html'; }

async function api(method, path, body) {
  const r = await fetch(API + path, {
    method,
    headers: { 'Content-Type': 'application/json', 'x-crm-token': TOKEN },
    body: body ? JSON.stringify(body) : undefined
  });
  if (r.status === 401) { localStorage.removeItem('crm_token'); window.location.href = '/login'; return; }
  return r.json();
}
const get = p => api('GET', p);
const post = (p, b) => api('POST', p, b);
const put = (p, b) => api('PUT', p, b);
const del = p => api('DELETE', p);

// ─── DASHBOARD ───────────────────────────────────────────────────────────────

let _dashCharts = {};

async function renderDashboard() {
  const [{ data }, vendasR, finR] = await Promise.all([
    get('/api/dashboard'), get('/api/vendas'), get('/api/financeiro/entradas')
  ]);
  const { kpis, aniversarios_mes, proximos_lancamentos, funil, leads_esquecidos } = data;

  document.getElementById('badge-leads').textContent = kpis.leads_novos;

  const statusLabel = { novo: 'Novo', qualificado: 'Qualificado', visitou: 'Visitou', proposta: 'Proposta', vendido: 'Vendido', perdido: 'Perdido' };
  const statusColors = { novo:'#00C4B4', qualificado:'#0099CC', visitou:'#F59E0B', proposta:'#A855F7', vendido:'#22C55E', perdido:'#EF4444' };

  // Agrupa vendas por mês (últimos 6 meses)
  const vendas = vendasR.data || [];
  const meses = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(); d.setMonth(d.getMonth() - i);
    meses.push({ label: d.toLocaleDateString('pt-BR',{month:'short',year:'2-digit'}), key: `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}` });
  }
  const vendasPorMes = meses.map(m => vendas.filter(v => v.data_venda?.startsWith(m.key) && v.status==='ativo').reduce((s,v) => s+v.valor,0));

  // Entradas por status
  const entradas = finR.data || [];
  const recebido = entradas.filter(e => e.status==='recebido').reduce((s,e) => s+e.valor, 0);
  const pendente = entradas.filter(e => e.status==='pendente').reduce((s,e) => s+e.valor, 0);

  document.getElementById('content').innerHTML = `
    <div class="kpi-grid">
      ${kpi('🎯', 'Leads Novos', kpis.leads_novos, `${kpis.leads_total} total`)}
      ${kpi('🏆', 'Vendas no Mês', fmt(kpis.vendas_mes), `${kpis.vendas_total} negócios ativos`)}
      ${kpi('💰', 'Recebíveis Pendentes', fmt(kpis.entradas_pendentes), 'a receber')}
      ${kpi('🏗️', 'Empreendimentos', kpis.empreendimentos, '')}
      ${kpi('🏢', 'Incorporadores', kpis.clientes_total, 'loteadores/incorporadores')}
      ${kpi('👥', 'Corretores Ativos', kpis.corretores_ativos, '')}
    </div>

    <div class="dash-row" style="margin-bottom:20px">
      <div class="mini-card">
        <h4>📈 VGV Vendido — Últimos 6 meses</h4>
        <div style="position:relative;height:180px;margin-top:12px">
          <canvas id="chart-vendas"></canvas>
        </div>
      </div>
      <div class="mini-card">
        <h4>🎯 Funil de Leads</h4>
        <div style="position:relative;height:180px;margin-top:12px">
          <canvas id="chart-funil"></canvas>
        </div>
      </div>
    </div>

    <div class="dash-row" style="margin-bottom:20px">
      <div class="mini-card">
        <h4>💰 Financeiro — Entradas</h4>
        <div style="position:relative;height:160px;margin-top:12px">
          <canvas id="chart-fin"></canvas>
        </div>
      </div>
      <div class="mini-card">
        <h4>🎂 Aniversários do Mês</h4>
        <div class="aniv-list" style="max-height:280px;overflow-y:auto">
          ${aniversarios_mes.length ? aniversarios_mes.map(a => {

function toggleNovoLead(value) {
  const el = document.getElementById('novo-lead-fields');
  if (el) el.style.display = value === '__novo__' ? 'block' : 'none';
}

function preencherUnidade(sel) {
  const o = sel.options[sel.selectedIndex];
  if (o.dataset.preco) document.getElementById('f-valor').value = o.dataset.preco;
  if (o.dataset.label) document.getElementById('f-imovel').value = o.dataset.label;
}

async function carregarUnidadesVenda(empId) {
  const sel = document.getElementById('f-unidade');
  const infoComissao = document.getElementById('info-comissao');
  if (!sel) return;
  sel.innerHTML = '<option value="">⏳ Carregando...</option>';
  if (!empId) { sel.innerHTML = '<option value="">— Sem unidade —</option>'; return; }
  const r = await get(`/api/empreendimentos/${empId}/unidades`);
  const units = (r.data || []).filter(u => u.status === 'disponivel' || u.status === 'reservado');
  const empTipo = (currentData.emp||[]).find(e => e.id == empId)?.tipo || 'loteamento';
  const isPredio = empTipo === 'predio';
  const lblA = isPredio ? 'Andar' : 'Qd';
  const lblB = isPredio ? 'Apto' : 'Lote';
  sel.innerHTML = '<option value="">— Selecione a unidade —</option>' + units.map(u => `<option value="${u.id}" data-preco="${u.preco||''}" data-label="${lblA} ${u.quadra||'?'} ${lblB} ${u.lote}">${u.quadra ? `${lblA} ${u.quadra} - ` : ''}${lblB} ${u.lote}${u.area_m2 ? ` (${u.area_m2}m²)` : ''}${u.preco ? ` — R$ ${u.preco.toLocaleString('pt-BR')}` : ''}${u.status==='reservado'?' 🟡 RESERVADO':''}</option>`).join('');
  if (!units.length) sel.innerHTML = '<option value="">Nenhuma unidade disponível</option>';

  // Atualiza preview de comissão quando muda empreendimento
  const emp = (currentData.emp||[]).find(e => e.id == empId);
  if (emp?.percentual_r2x && infoComissao) {
    infoComissao.textContent = `% R2X: ${emp.percentual_r2x}% — comissão calculada automaticamente ao salvar`;
    infoComissao.style.color = 'var(--accent)';
  } else if (infoComissao) {
    infoComissao.textContent = 'Este empreendimento não tem % R2X configurado.';
    infoComissao.style.color = 'var(--text2)';
  }
}

        </div>
        <div style="font-size:11px;color:var(--text2);margin-top:6px">O lead será criado com status "vendido" e faixa de investimento igual ao valor da venda.</div>
      </div>
      <div class="form-group"><label>Corretor</label>
        <select id="f-corretor"><option value="">—</option>${(corretores||[]).map(c => `<option value="${c.id}" ${venda.corretor_id==c.id?'selected':''}>${c.nome}</option>`).join('')}</select>

      </div>
      <div class="form-group"><label>% Comissão Corretor</label><input id="f-com-pct" type="number" step="0.1" min="0" max="100" value="${venda.comissao_corretor_pct||''}" placeholder="ex: 1.0" oninput="calcComissaoCorretor()"></div>
      <div class="form-group"><label>Valor Comissão Corretor (R$)</label><input id="f-com-valor" type="number" step="0.01" value="${venda.comissao_corretor_valor||''}" style="opacity:.75" placeholder="Calculado automaticamente"></div>
      <div class="form-group"><label>Status Comissão Corretor</label>
        <select id="f-com-status">
          <option value="pendente" ${(!venda.comissao_corretor_status||venda.comissao_corretor_status==='pendente')?'selected':''}>⏳ Pendente</option>
          <option value="pago" ${venda.comissao_corretor_status==='pago'?'selected':''}>✅ Pago</option>
        </select>
      </div>
      <div class="form-group span2"><label>Observações</label><textarea id="f-obs">${venda.observacoes||''}</textarea></div>
    </div>
  `, async () => {
    const unidadeId = v('f-unidade') || null;
    let leadId = v('f-lead') || null;
    const valor = parseFloat(v('f-valor'));

    // Se for novo lead, cria primeiro
    if (leadId === '__novo__') {
      const nome = v('nl-nome');
      if (!nome) return toast('Nome do novo lead é obrigatório', 'error');
      const empId = v('f-emp') || null;
      const empNome = empId ? (currentData.emp||[]).find(e => e.id == empId)?.nome : null;
      const novoLead = {
        nome,
        telefone: v('nl-tel'),
        email: v('nl-email'),
        cidade: v('nl-cidade'),
        empreendimento_id: empId,
        empreendimento_interesse: empNome,
        corretor_id: v('f-corretor') || null,
        faixa_investimento: valor ? `R$ ${valor.toLocaleString('pt-BR')}` : null,
        status: 'vendido',
        origem: 'venda_direta'
      };
      const lr = await post('/api/leads', novoLead);
      if (!lr.ok) return toast('Erro ao criar lead: ' + lr.error, 'error');
      leadId = lr.data.id;
    }

    const comPct = parseFloat(v('f-com-pct'))||null;
    const comValor = parseFloat(v('f-com-valor'))||null;
    const body = { data_venda: v('f-data'), valor, imovel: v('f-imovel'), status: v('f-status'), lead_id: leadId, corretor_id: v('f-corretor')||null, empreendimento_id: v('f-emp')||null, cliente_id: v('f-cliente')||null, unidade_id: unidadeId, observacoes: v('f-obs'), comissao_corretor_pct: comPct, comissao_corretor_valor: comValor, comissao_corretor_status: comPct ? (v('f-com-status')||'pendente') : null };
    if (!body.valor || !body.data_venda) return toast('Valor e data são obrigatórios', 'error');
    const r = venda.id ? await put(`/api/vendas/${venda.id}`, body) : await post('/api/vendas', body);
    if (!r.ok) return toast(r.error, 'error');
    if (r.data?.aviso) toast(r.data.aviso, 'error');
    if (r.data?.comissao_r2x) toast(`Comissão R2X gerada: R$ ${r.data.comissao_r2x.toLocaleString('pt-BR', {minimumFractionDigits:2})} (pendente no financeiro)`);
    else toast(venda.id ? 'Venda atualizada!' : 'Venda registrada!');
    closeModal(); renderVendas();
  });

  // Carrega unidades se empreendimento já estiver selecionado
  if (venda.empreendimento_id) setTimeout(() => carregarUnidadesVenda(venda.empreendimento_id), 100);
}

async function buscarCNPJ() {
  const cnpj = document.getElementById('f-cnpj').value.replace(/\D/g, '');
  if (cnpj.length !== 14) return;
  const btn = document.getElementById('btn-buscar-cnpj');
  btn.textContent = '⏳ Buscando...';
  btn.disabled = true;
  try {
    const res = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${cnpj}`);
    if (!res.ok) throw new Error('CNPJ não encontrado');
    const d = await res.json();
    const rs = d.razao_social || '';
    const nomeFantasia = d.nome_fantasia || '';
    document.getElementById('f-rs').value = nomeFantasia || rs;
    const ddd = d.ddd_telefone_1 ? d.ddd_telefone_1.replace(/\D/g,'') : '';
    document.getElementById('f-tel').value = ddd ? ddd : (document.getElementById('f-tel').value || '');
    document.getElementById('f-email').value = document.getElementById('f-email').value || (d.email || '').toLowerCase();
    document.getElementById('f-cidade').value = d.municipio ? d.municipio.charAt(0) + d.municipio.slice(1).toLowerCase() : '';
    document.getElementById('f-estado').value = d.uf || '';
    btn.textContent = '✅ Preenchido!';
    setTimeout(() => { btn.textContent = '🔍 Buscar CNPJ'; btn.disabled = false; }, 2000);
  } catch (e) {
    btn.textContent = '❌ Não encontrado';
    btn.disabled = false;
    setTimeout(() => { btn.textContent = '🔍 Buscar CNPJ'; }, 2000);
  }
}

async function renderEmpreendimentos(filter = '') {
  const [er, cr, lr] = await Promise.all([get('/api/empreendimentos'), get('/api/clientes'), get('/api/empreendimentos/lucratividade')]);
  currentData.emp = er.data; currentData.clientes = cr.data;
  let rows = er.data;
  if (filter) rows = rows.filter(e => e.nome.toLowerCase().includes(filter) || (e.cidade||'').toLowerCase().includes(filter));

  const statusBadge = { prospecto: 'badge-gray', planejamento: 'badge-blue', pre_lancamento: 'badge-yellow', lancamento: 'badge-accent', vendas: 'badge-green', encerrado: 'badge-red' };

  // KPIs agregados
  const vgvTotal = rows.reduce((s,e) => s + (e.vgv_estimado||0), 0);
  const unidadesTotal = rows.reduce((s,e) => s + (e.num_unidades||0), 0);
  const ativos = rows.filter(e => !['encerrado','prospecto'].includes(e.status)).length;

  // Mapa de cidades — agrupar empreendimentos por cidade
  const cidadeMap = {};
  rows.forEach(e => {
    if (!e.cidade) return;
    const k = `${e.cidade}${e.estado?'/'+e.estado:''}`;
    cidadeMap[k] = (cidadeMap[k]||0) + 1;
  });
  const cidades = Object.entries(cidadeMap).sort((a,b) => b[1]-a[1]);

  // Lucratividade ordenada
  const lucros = [...(lr.data||[])].sort((a,b) => b.lucro_total - a.lucro_total);

  document.getElementById('content').innerHTML = `
    <div class="kpi-grid" style="margin-bottom:20px">
      ${kpi('🏗️', 'Total de Empreendimentos', rows.length, `${ativos} em andamento`)}
      ${kpi('🏠', 'Total de Unidades', unidadesTotal.toLocaleString('pt-BR'), 'soma de todos os empreendimentos')}
      ${kpi('💎', 'VGV Total Estimado', fmt(vgvTotal), 'soma de todos os VGVs')}
      ${kpi('📍', 'Cidades com Lançamentos', cidades.length, cidades.slice(0,3).map(c=>c[0]).join(', ')||'—')}
    </div>

    <div class="dash-row" style="margin-bottom:20px">
      <div class="mini-card" style="grid-column:span 2">
        <h4>🏆 Ranking de Lucratividade R2X</h4>
        <div style="margin-top:8px;max-height:280px;overflow-y:auto">
          ${lucros.length ? lucros.map((l,i) => {
            const lucroClasse = l.lucro_total >= 0 ? 'var(--success)' : 'var(--danger)';
            const medalha = i===0?'🥇':i===1?'🥈':i===2?'🥉':`#${i+1}`;
            return `
              <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
                <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">
                  <div style="font-weight:700;font-size:13px;color:${i<3?'var(--accent)':'var(--text2)'};width:30px">${medalha}</div>
                  <div style="min-width:0;flex:1">
                    <div style="font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${l.nome}</div>
                    <div style="font-size:11px;color:var(--text2)">Receita: ${fmt(l.receita_total)} · Despesa: ${fmt(l.despesa_total)}</div>
                  </div>
                </div>
                <div style="font-weight:700;color:${lucroClasse};font-size:14px;white-space:nowrap">${fmt(l.lucro_total)}</div>
              </div>
            `;
          }).join('') : '<div style="color:var(--text2);font-size:13px;padding:8px 0">Sem dados financeiros ainda</div>'}
        </div>
      </div>
    </div>
    <div class="table-card">
      <div class="table-header"><div class="table-title">🏗️ Empreendimentos (${rows.length})</div></div>
      <table>
        <thead><tr><th>Nome</th><th>Incorporador</th><th>Cidade</th><th>Unidades</th><th>VGV Estimado</th><th>Status</th><th>Lançamento</th><th></th></tr></thead>
        <tbody>
          ${rows.length ? rows.map(e => `
            <tr>
              <td><strong>${e.nome}</strong></td>
              <td>${e.cliente_nome||'—'}</td>
              <td>${e.cidade||'—'}${e.estado?'/'+e.estado:''}</td>
              <td>${e.num_unidades||'—'}</td>
              <td style="color:var(--success)">${e.vgv_estimado ? fmt(e.vgv_estimado) : '—'}</td>
              <td><span class="badge ${statusBadge[e.status]||'badge-gray'}">${e.status}</span></td>
              <td>${e.data_lancamento ? fmtDate(e.data_lancamento) : '—'}</td>
              <td style="white-space:nowrap">
                ${e.num_unidades ? `<button class="btn-icon" title="Ver unidades" onclick="verUnidades(${e.id})">🏠</button>` : ''}
                <button class="btn-icon" title="Relatório gerencial" onclick="gerarRelatorio(${e.id})" style="color:var(--accent)">📊</button>
                <button class="btn-icon btn-edit" onclick="editEmp(${e.id})">✏️</button>
                <button class="btn-icon btn-delete" onclick="deleteEmp(${e.id})">🗑️</button>
              </td>
            </tr>
          `).join('') : '<tr class="empty-row"><td colspan="8">Nenhum empreendimento cadastrado</td></tr>'}
        </tbody>
      </table>
    </div>
  `;
}

async function gerarContrato(empId) {
  const url = `/api/empreendimentos/${empId}/contrato`;
  try {
    const res = await fetch(url, { headers: { 'x-crm-token': localStorage.getItem('crm_token') || '' } });
    if (!res.ok) {
      const data = await res.json();
      return toast('Erro: ' + (data.error || 'falha'), 'error');
    }
    const blob = await res.blob();
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = res.headers.get('Content-Disposition')?.match(/filename="(.+)"/)?.[1] || 'contrato.docx';
    link.click();
    URL.revokeObjectURL(link.href);
    toast('Contrato gerado! 📄');
  } catch(e) {
    toast('Falha ao gerar contrato', 'error');
  }
}

  const input = document.getElementById('f-excel');
  const status = document.getElementById('upload-status');
  if (!input.files.length) { status.textContent = '⚠️ Selecione um arquivo primeiro.'; return; }
  status.textContent = '⏳ Importando...';
  const fd = new FormData();
  fd.append('arquivo', input.files[0]);
  try {
    const res = await fetch(`/api/empreendimentos/${empId}/unidades/upload`, { method: 'POST', headers: { 'x-crm-token': localStorage.getItem('crm_token') || '' }, body: fd });
    const data = await res.json();
    if (data.ok) {
      // Atualiza os campos do formulário com VGV e nº de unidades calculados
      const fUnits = document.getElementById('f-units');
      const fVgv = document.getElementById('f-vgv');
      if (fUnits) fUnits.value = data.data.total || '';
      if (fVgv) fVgv.value = data.data.vgv_total || '';
      status.style.color = 'var(--success)';
      status.innerHTML = `✅ ${data.data.importadas} unidades importadas! VGV total: <strong>R$ ${(data.data.vgv_total||0).toLocaleString('pt-BR', {minimumFractionDigits:2})}</strong>`;
      // Atualiza a memória local também
      const emp = (currentData.emp||[]).find(e => e.id == empId);
      if (emp) { emp.num_unidades = data.data.total; emp.vgv_estimado = data.data.vgv_total; }
    } else {
      status.style.color = 'var(--danger)';
      status.textContent = '❌ Erro: ' + data.error;
    }
  } catch(e) {
    status.style.color = 'var(--danger)';
    status.textContent = '❌ Falha na importação.';
  }
}
async function editEmp(id) { openEmpModal(currentData.emp.find(e => e.id === id)); }

  if (cidadeFilter) rows = rows.filter(c => (c.cidade||'').toLowerCase() === cidadeFilter.toLowerCase());
  if (sortByVendas) rows = [...rows].sort((a, b) => (b.total_vendas - a.total_vendas) || (b.vgv_vendido - a.vgv_vendido));

  const cidades = [...new Set(r.data.map(c => c.cidade).filter(Boolean))].sort();
  const linkCadastro = `${window.location.origin}/cadastro-corretor`;

            <option value="">Todas as cidades</option>
            ${cidades.map(ci => `<option value="${ci}" ${ci.toLowerCase()===cidadeFilter.toLowerCase()&&cidadeFilter?'selected':''}>${ci}</option>`).join('')}
          </select>
          <button id="sort-vendas" data-ativo="${sortByVendas?'1':'0'}" onclick="(function(){const s=document.getElementById('sort-vendas');const ativo=s.dataset.ativo==='1';const cidade=document.getElementById('filtro-cidade').value;renderCorretores('',cidade,!ativo);})()" style="padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:${sortByVendas?'var(--accent)':'var(--navy3)'};color:${sortByVendas?'#fff':'var(--text1)'};font-size:13px;cursor:pointer">

        <thead><tr>${sortByVendas?'<th>#</th>':''}<th>Nome</th><th>CRECI</th><th>Telefone</th><th>Imobiliária</th><th>Cidade</th><th>Vendas</th><th>VGV Vendido</th><th>Status</th><th></th></tr></thead>
        <tbody>
          ${rows.length ? rows.map((c, i) => `
            <tr>
              ${sortByVendas ? `<td style="text-align:center;font-weight:700;color:${i===0?'#FFD700':i===1?'#C0C0C0':i===2?'#CD7F32':'var(--text2)'}">${i===0?'🥇':i===1?'🥈':i===2?'🥉':`#${i+1}`}</td>` : ''}
              <td><strong>${c.nome}</strong></td>
              <td>${c.creci||'—'}</td>
              <td>${c.telefone ? `<a href="https://wa.me/55${c.telefone}" target="_blank" style="color:var(--accent)">📱 ${fmtPhone(c.telefone)}</a>` : '—'}</td>

async function renderFinanceiro(filter = '') {
  const [er, sr, dr, empr, resr] = await Promise.all([get('/api/financeiro/entradas'), get('/api/financeiro/saidas'), get('/api/financeiro/distribuicoes'), get('/api/empreendimentos'), get('/api/financeiro/resumo')]);

  const resumo = resr.data;

  const totalEntradas = er.data.filter(e => e.status==='recebido').reduce((s,e) => s+e.valor, 0);
  const totalPendente = er.data.filter(e => e.status!=='recebido').reduce((s,e) => s+e.valor, 0);
  const totalSaidas = sr.data.filter(e => e.status==='pago').reduce((s,e) => s+e.valor, 0);

      ${kpi('💸', 'Distribuído Ramon', fmt(totalDist), 'retiradas')}

            <input type="checkbox" id="f-parcelar" onchange="toggleParcelamento(this.checked)"> Parcelar recebimento

          <div id="parcela-fields" style="display:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <label style="font-size:13px">Nº de parcelas:</label>
            <input id="f-nparcelas" type="number" min="2" max="60" value="2" style="width:70px;padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:var(--navy2);color:var(--text1)">
            <label style="font-size:13px">1ª parcela em:</label>
            <input id="f-data-ini" type="date" style="padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:var(--navy2);color:var(--text1)">
          </div>
        </div>
      </div>` : ''}
      <div class="form-group span2"><label>Observações</label><textarea id="f-obs">${e.observacoes||''}</textarea></div>
    </div>
  `, async () => {
    const body = { descricao: v('f-desc'), tipo: v('f-tipo'), empreendimento_id: v('f-emp')||null, valor: parseFloat(v('f-valor')), status: v('f-status'), data_prevista: v('f-prev'), data_recebimento: v('f-rec'), observacoes: v('f-obs') };
    if (!body.descricao || !body.valor) return toast('Descrição e valor obrigatórios', 'error');

    const parcelar = document.getElementById('f-parcelar')?.checked;
    if (isNew && parcelar) {
      const n = parseInt(document.getElementById('f-nparcelas')?.value) || 2;
      const dataIni = document.getElementById('f-data-ini')?.value;
      if (!dataIni) return toast('Informe a data da 1ª parcela', 'error');
      const valorParcela = parseFloat((body.valor / n).toFixed(2));
      for (let i = 0; i < n; i++) {
        const d = new Date(dataIni + 'T12:00:00');
        d.setMonth(d.getMonth() + i);
        const dataStr = d.toISOString().slice(0,10);
        await post('/api/financeiro/entradas', { ...body, valor: valorParcela, data_prevista: dataStr, parcela_num: i+1, parcela_total: n, descricao: `${body.descricao} (${i+1}/${n})` });
      }
      toast(`${n} parcelas criadas!`); closeModal(); renderFinanceiro(); return;
    }

    const r = e.id ? await put(`/api/financeiro/entradas/${e.id}`, body) : await post('/api/financeiro/entradas', body);
    if (!r.ok) return toast(r.error, 'error');
    toast('Salvo!'); closeModal(); renderFinanceiro();
  });
}

function toggleParcelamento(checked) {
  const el = document.getElementById('parcela-fields');
  if (el) el.style.display = checked ? 'flex' : 'none';
}

async function filterRanking(val, tipo) {
  const params = new URLSearchParams();
  if (tipo === 'emp' && val) params.set('empreendimento_id', val);
  if (tipo === 'periodo' && val) params.set('periodo', val);
  const r = await get(`/api/vendas/ranking?${params}`);

    body{font-family:Arial,sans-serif;color:#1a1a2e;font-size:13px;padding:32px 40px}

    .logo{font-size:26px;font-weight:900;letter-spacing:-1px;color:#0D1B2E}.logo span{color:#00C4B4}
    .logo small{display:block;font-size:11px;font-weight:400;color:#666;margin-top:2px}
    .report-info{text-align:right;font-size:12px;color:#555}
    .report-info strong{display:block;font-size:18px;color:#0D1B2E;margin-bottom:4px}
    .perfil{display:flex;gap:24px;align-items:flex-start;background:#f5f7fa;border-radius:10px;padding:20px 24px;margin-bottom:28px;border:1px solid #e0e4ea}
    .perfil-avatar{width:64px;height:64px;border-radius:50%;background:#0D1B2E;color:#00C4B4;font-size:28px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .perfil-info{flex:1}
    .perfil-info h2{font-size:20px;font-weight:900;color:#0D1B2E;margin-bottom:6px}
    .perfil-info .meta{font-size:12px;color:#555;display:flex;flex-wrap:wrap;gap:12px}
    .perfil-info .meta span{display:flex;align-items:center;gap:4px}
    .badge-ativo{background:#e6f9ee;color:#1a8a4a;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:700}
    .badge-inativo{background:#fdecea;color:#b91c1c;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:700}
    h2.section{font-size:14px;font-weight:700;color:#0D1B2E;margin:24px 0 12px;border-left:4px solid #00C4B4;padding-left:10px}
    .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
    .kpi{background:#f5f7fa;border-radius:8px;padding:14px 16px;border:1px solid #e0e4ea}
    .kpi label{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#666;display:block;margin-bottom:4px}
    .kpi strong{font-size:18px;font-weight:900;color:#0D1B2E}
    .kpi small{font-size:11px;color:#888;display:block;margin-top:2px}
    table{width:100%;border-collapse:collapse;margin-bottom:20px}
    th{background:#0D1B2E;color:#fff;padding:8px 12px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
    td{padding:8px 12px;border-bottom:1px solid #eee;font-size:12px}
    tr:nth-child(even) td{background:#fafbfc}
    .bar-wrap{background:#eee;border-radius:4px;height:8px;display:inline-block;width:80px;vertical-align:middle;margin-right:6px}
    .bar-fill{height:100%;border-radius:4px;background:#00C4B4}
    .funil-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #eee}
    .funil-label{min-width:90px;font-size:12px;color:#555}
    .funil-n{min-width:28px;text-align:right;font-weight:700;color:#0D1B2E}
    .meta-box{background:#f5f7fa;border-radius:8px;padding:16px;border:1px solid #e0e4ea;margin-bottom:20px}
    .meta-box h3{font-size:13px;font-weight:700;color:#0D1B2E;margin-bottom:12px}
    .meta-item{display:flex;align-items:center;gap:12px;margin-bottom:8px;font-size:12px}
    .meta-item label{min-width:110px;color:#666}
    .meta-item .val{font-weight:700;min-width:80px}
    .pct-bar{flex:1;background:#eee;border-radius:4px;height:10px;overflow:hidden}
    .pct-fill{height:100%;border-radius:4px}
    .pct-label{min-width:40px;text-align:right;font-weight:700}
    .g{color:#1a8a4a}.y{color:#b07d00}.r{color:#b91c1c}
    .footer{margin-top:40px;border-top:1px solid #ccc;padding-top:12px;display:flex;justify-content:space-between;font-size:11px;color:#888}
    @media print{body{padding:16px}h2.section{break-before:auto}}
  </style></head><body>

  <div class="header">
    <div class="logo">R<span>2</span>X<small>Inteligência Comercial em Lançamentos</small></div>
    <div class="report-info"><strong>Relatório de Corretor</strong>Emitido em ${dataEmissao}</div>
  </div>

  <!-- PERFIL -->
  <div class="perfil">
    <div class="perfil-avatar">${c.nome.charAt(0).toUpperCase()}</div>
    <div class="perfil-info">
      <h2>${c.nome} <span class="${c.ativo?'badge-ativo':'badge-inativo'}">${c.ativo?'Ativo':'Inativo'}</span></h2>
      <div class="meta">
        ${c.creci    ? `<span>📋 CRECI: <strong>${c.creci}</strong></span>` : ''}
        ${c.cpf      ? `<span>🪪 CPF: <strong>${c.cpf}</strong></span>` : ''}
        ${c.imobiliaria ? `<span>🏢 ${c.imobiliaria}</span>` : ''}
        ${c.cidade   ? `<span>📍 ${c.cidade}${c.estado?'/'+c.estado:''}</span>` : ''}
        ${c.telefone ? `<span>📱 ${fmtPhone(c.telefone)}</span>` : ''}
        ${c.email    ? `<span>✉️ ${c.email}</span>` : ''}
        ${c.aniversario ? `<span>🎂 ${fmtDate(c.aniversario)}</span>` : ''}
      </div>
    </div>
  </div>

  <!-- KPIs -->
  <h2 class="section">📊 Desempenho Geral</h2>
  <div class="kpi-row">
    <div class="kpi"><label>Total de Vendas</label><strong>${vendas.length}</strong><small>negócios ativos</small></div>
    <div class="kpi"><label>VGV Gerado</label><strong style="font-size:14px">${fmt(vgvTotal)}</strong><small>em vendas ativas</small></div>
    <div class="kpi"><label>Leads Recebidos</label><strong>${leads.length}</strong><small>${leadsAtivos} em andamento</small></div>
    <div class="kpi"><label>Taxa de Conversão</label><strong class="${parseFloat(taxaConv)>=30?'g':parseFloat(taxaConv)>=15?'y':'r'}">${taxaConv}%</strong><small>${leadsConv} de ${leads.length} leads</small></div>
  </div>
  <div class="kpi-row">
    <div class="kpi"><label>Comissão Pendente</label><strong class="y" style="font-size:14px">${fmt(comPendente)}</strong><small>a receber</small></div>
    <div class="kpi"><label>Comissão Paga</label><strong class="g" style="font-size:14px">${fmt(comPago)}</strong><small>já quitada</small></div>
    <div class="kpi"><label>Comissão Total</label><strong style="font-size:14px">${fmt(comPendente+comPago)}</strong><small>total gerado</small></div>
    <div class="kpi"><label>Ticket Médio</label><strong style="font-size:14px">${vendas.length ? fmt(Math.round(vgvTotal/vendas.length)) : '—'}</strong><small>por venda</small></div>
  </div>

  ${metaMes ? `
  <!-- META DO MÊS -->
  <h2 class="section">🎯 Meta — ${mesNome}</h2>
  <div class="meta-box">
    <h3>Empreendimento: ${metaMes.empreendimento_nome||'Geral'}</h3>
    <div class="meta-item">
      <label>Vendas (qtd)</label>
      <div class="val">${metaMes.real_qtd} / ${metaMes.meta_qtd}</div>
      <div class="pct-bar"><div class="pct-fill" style="width:${metaQtdPct}%;background:${metaQtdPct>=100?'#22C55E':metaQtdPct>=50?'#F59E0B':'#EF4444'}"></div></div>
      <div class="pct-label ${metaQtdPct>=100?'g':metaQtdPct>=50?'y':'r'}">${metaQtdPct}%</div>
    </div>
    <div class="meta-item">
      <label>VGV</label>
      <div class="val">${fmt(metaMes.real_vgv)} / ${fmt(metaMes.meta_vgv)}</div>
      <div class="pct-bar"><div class="pct-fill" style="width:${metaVgvPct}%;background:${metaVgvPct>=100?'#22C55E':metaVgvPct>=50?'#F59E0B':'#EF4444'}"></div></div>
      <div class="pct-label ${metaVgvPct>=100?'g':metaVgvPct>=50?'y':'r'}">${metaVgvPct}%</div>
    </div>
  </div>` : ''}

  <!-- EVOLUÇÃO MENSAL -->
  <h2 class="section">📅 Evolução Mensal — Últimos 6 meses</h2>
  <table>
    <thead><tr><th>Mês</th><th style="text-align:center">Vendas (qtd)</th><th>VGV</th><th>Evolução</th></tr></thead>
    <tbody>
      ${meses.map(m => {
        const maxVgv = Math.max(...meses.map(x=>x.vgv),1);
        const pct = Math.round((m.vgv/maxVgv)*100);
        return `<tr>
          <td style="font-weight:600">${m.label}</td>
          <td style="text-align:center">${m.qtd||'—'}</td>
          <td style="color:${m.vgv>0?'#1a8a4a':'#888'}">${m.vgv>0?fmt(m.vgv):'—'}</td>
          <td><div style="display:flex;align-items:center;gap:6px">
            <div class="bar-wrap" style="width:100px"><div class="bar-fill" style="width:${pct}%"></div></div>
          </div></td>
        </tr>`;
      }).join('')}
    </tbody>
  </table>

  <!-- POR EMPREENDIMENTO -->
  ${empRanking.length ? `
  <h2 class="section">🏗️ Vendas por Empreendimento</h2>
  <table>
    <thead><tr><th>Empreendimento</th><th style="text-align:center">Vendas</th><th>VGV</th></tr></thead>
    <tbody>
      ${empRanking.map(e => `<tr>
        <td><strong>${e.nome}</strong></td>
        <td style="text-align:center">${e.vendas}</td>
        <td style="color:#1a8a4a;font-weight:600">${fmt(e.vgv)}</td>
      </tr>`).join('')}
    </tbody>
  </table>` : ''}

  <!-- FUNIL DE LEADS -->
  ${leads.length ? `
  <h2 class="section">🎯 Funil de Leads</h2>
  <div style="max-width:400px;margin-bottom:20px">
    ${funil.filter(f=>f.n>0).map(f => {
      const pct = Math.round((f.n/leads.length)*100);
      return `<div class="funil-row">
        <div class="funil-label">${statusLabel[f.status]}</div>
        <div class="bar-wrap" style="width:160px"><div class="bar-fill" style="width:${pct}%;background:${f.status==='vendido'?'#22C55E':f.status==='perdido'?'#EF4444':'#00C4B4'}"></div></div>
        <div class="funil-n">${f.n}</div>
        <div style="font-size:11px;color:#888">(${pct}%)</div>
      </div>`;
    }).join('')}
  </div>` : ''}

  <!-- LISTA DE VENDAS -->
  <h2 class="section">🏆 Lista de Vendas</h2>
  <table>
    <thead><tr><th>Data</th><th>Lead</th><th>Empreendimento</th><th>Imóvel</th><th>Valor</th><th>Comissão</th><th>Status Com.</th></tr></thead>
    <tbody>
      ${vendas.length ? vendas.map(v => `<tr>
        <td>${fmtDate(v.data_venda)}</td>
        <td>${v.lead_nome||'—'}</td>
        <td>${v.empreendimento_nome||'—'}</td>
        <td>${v.imovel||'—'}</td>
        <td style="font-weight:600;color:#1a8a4a">${fmt(v.valor)}</td>
        <td>${v.comissao_corretor_valor?fmt(v.comissao_corretor_valor)+'<small style="color:#888"> ('+v.comissao_corretor_pct+'%)</small>':'—'}</td>
        <td>${v.comissao_corretor_status==='pago'?'<span style="color:#1a8a4a;font-weight:700">✅ Pago</span>':v.comissao_corretor_valor?'<span style="color:#b07d00;font-weight:700">⏳ Pendente</span>':'—'}</td>
      </tr>`).join('') : '<tr><td colspan="7" style="text-align:center;color:#888;padding:16px">Nenhuma venda registrada</td></tr>'}
    </tbody>
  </table>

  <!-- LEADS ATIVOS -->
  ${leadsAtivos > 0 ? `
  <h2 class="section">🎯 Leads em Andamento (${leadsAtivos})</h2>
  <table>
    <thead><tr><th>Nome</th><th>Telefone</th><th>Cidade</th><th>Interesse</th><th>Faixa</th><th>Status</th></tr></thead>
    <tbody>
      ${leads.filter(l=>!['vendido','perdido'].includes(l.status)).map(l => `<tr>
        <td><strong>${l.nome||'—'}</strong></td>
        <td>${fmtPhone(l.telefone)}</td>
        <td>${l.cidade||'—'}</td>
        <td>${l.empreendimento_nome||l.empreendimento_interesse||'—'}</td>
        <td>${l.faixa_investimento||'—'}</td>
        <td>${l.status}</td>
      </tr>`).join('')}
    </tbody>
  </table>` : ''}

  <div class="footer">
    <span>R2X Inteligência Comercial · comercial@r2xlancamentos.com.br</span>
    <span>Gerado em ${dataEmissao} via CRM R2X</span>
  </div>
  ${'<sc'+'ript>window.onload=()=>window.print()<'+'/script>'}
  </body></html>`;

  const w = window.open('','_blank');
  w.document.write(html);
  w.document.close();
}

// ─── METAS ────────────────────────────────────────────────────────────────────

async function openMetaModal(mes, ano) {
  const cr = await get('/api/corretores');
  const corretores = cr.data || [];
  const emp = currentData.emp || [];
  const mesNome = new Date(ano, mes-1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});

  openModal('🎯 Definir Meta do Mês', `
    <div style="font-size:12px;color:var(--accent);margin-bottom:14px;background:rgba(0,196,180,.08);padding:8px 12px;border-radius:6px">
      📅 Período de referência: <strong>${mesNome}</strong>
    </div>
    <div class="form-grid">
      <div class="form-group"><label>Corretor *</label>
        <select id="f-corretor">
          <option value="">— Selecione o corretor —</option>
          ${corretores.map(c => `<option value="${c.id}">${c.nome}${c.imobiliaria?' ('+c.imobiliaria+')':''}</option>`).join('')}
        </select>
      </div>
      <div class="form-group"><label>Empreendimento (opcional)</label>
        <select id="f-emp">
          <option value="">Geral (todos os empreendimentos)</option>
          ${emp.map(e => `<option value="${e.id}">${e.nome}</option>`).join('')}
        </select>
      </div>
      <div class="form-group"><label>Meta de Vendas (quantidade)</label>
        <input id="f-meta-qtd" type="number" min="0" value="0" placeholder="0">
      </div>
      <div class="form-group"><label>Meta VGV (R$)</label>
        <input id="f-meta-vgv" type="number" min="0" value="0" placeholder="0">
      </div>
    </div>
  `, async () => {
    const corrId = v('f-corretor');
    if (!corrId) return toast('Selecione um corretor', 'error');
    const body = {
      corretor_id: corrId,
      empreendimento_id: v('f-emp') || null,
      mes, ano,
      meta_qtd:  parseInt(v('f-meta-qtd'))  || 0,
      meta_vgv:  parseFloat(v('f-meta-vgv')) || 0
    };
    const r = await post('/api/metas', body);
    if (!r.ok) return toast(r.error, 'error');
    toast('Meta definida! 🎯');
    closeModal();
    renderRankingTab();
  });
}

async function deleteMeta(id, mes, ano) {
  if (!confirm('Excluir esta meta?')) return;
  await del(`/api/metas/${id}`);
  toast('Meta excluída');
  renderRankingTab();
}

// ─── SEARCH ───────────────────────────────────────────────────────────────────

function handleSearch(q) {
  const f = q.toLowerCase().trim();
  switch(currentPage) {
    case 'leads': renderLeads(f); break;
    case 'vendas': renderVendas(f); break;
    case 'clientes': renderClientes(f); break;
    case 'empreendimentos': renderEmpreendimentos(f); break;
    case 'corretores': renderCorretores(f); break;
  }
}

function handleAdd() {
  switch(currentPage) {
    case 'leads': openLeadModal(); break;
    case 'vendas': openVendaModal(); break;
    case 'clientes': openClienteModal(); break;
    case 'empreendimentos': openEmpModal(); break;
    case 'corretores': openCorretorModal(); break;
    case 'financeiro': finTab==='entradas' ? openEntradaModal() : finTab==='saidas' ? openSaidaModal() : finTab==='distribuicoes' ? openDistModal() : openCalModal(); break;
    case 'calendario': openCalModal(); break;
  }
}

// ─── MODAL UTILS ─────────────────────────────────────────────────────────────

function openModal(title, bodyHtml, onSave) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  document.getElementById('modal-foot').innerHTML = `
    <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-primary" onclick="modalSave()">Salvar</button>
  `;
  window._modalSave = onSave;
  document.getElementById('modal-overlay').classList.add('open');
}
function modalSave() { window._modalSave && window._modalSave(); }
function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); document.getElementById('modal').classList.remove('modal-wide'); }
function closeModalOutside(e) { if (e.target === document.getElementById('modal-overlay')) closeModal(); }

// ─── HELPERS ─────────────────────────────────────────────────────────────────

function v(id) { return document.getElementById(id)?.value || ''; }
function fmt(n) { return (n||0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', minimumFractionDigits: 0, maximumFractionDigits: 0 }); }
function fmtDate(d) { if (!d) return '—'; const [y,m,day] = d.split('T')[0].split('-'); return `${day}/${m}/${y}`; }
function fmtPhone(p) { if (!p) return '—'; const n = p.replace(/\D/g,''); return n.length===11 ? `(${n.slice(0,2)}) ${n.slice(2,7)}-${n.slice(7)}` : p; }
function today() { return new Date().toISOString().split('T')[0]; }
function badgeCalendario(tipo) { const m = {'lançamento':'badge-accent','pré-lançamento':'badge-yellow','evento':'badge-blue','reunião':'badge-gray'}; return m[tipo]||'badge-gray'; }

function toast(msg, type = 'success') {
  const el = document.createElement('div');
  el.className = `toast-item ${type}`;
  el.innerHTML = `${type==='success'?'✅':'❌'} ${msg}`;
  document.getElementById('toast').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

// ─── INIT ─────────────────────────────────────────────────────────────────────

// Redireciona para login se não tiver token
if (!TOKEN) { window.location.href = '/login'; }

renderPage('dashboard');

// PWA — registra service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
